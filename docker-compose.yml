version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: betting_user
      POSTGRES_PASSWORD: betting_pass
      POSTGRES_DB: betting_db
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d

  betting_engine:
    build: ./services/betting_engine
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_USER: betting_user
      DB_PASSWORD: betting_pass
      DB_NAME: betting_db

  settlement_engine:
    build: ./services/settlement_engine
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_USER: betting_user
      DB_PASSWORD: betting_pass
      DB_NAME: betting_db
      POLL_INTERVAL_MS: 10000

  nginx:
    image: nginx:alpine
    depends_on:
      - betting_engine
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

volumes:
  db_data:
