<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STRIKE Bet — Precision in Every Play.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:            #0a0e14;
      --bg-card:       #111722;
      --bg-input:      #0d1117;
      --bg-header:     #070b10;
      --sidebar-bg:    #111722;
      --border:        rgba(255,255,255,.06);
      --border-strong: rgba(255,255,255,.10);
      --green:         #00c85a;
      --green-dark:    #00a347;
      --orange:        #f5c518;
      --orange-dark:   #d4a800;
      --blue:          #3b82f6;
      --play-btn:      #ff4500;
      --play-btn-dark: #e03c00;
      --odds-bg:       #0d1420;
      --odds-sel-bg:   rgba(245,197,24,.13);
      --odds-sel-bd:   #f5c518;
      --text:          #f0f4f8;
      --text-sec:      #a0aec0;
      --text-muted:    #4a6080;
      --danger:        #ef4444;
      --amber:         #f59e0b;
      --radius:        6px;
      --shadow-sm:     0 2px 8px rgba(0,0,0,.25);
      --shadow-card:   0 4px 12px rgba(0,0,0,.3);
      --shadow-hover:  0 12px 32px rgba(0,0,0,.55);
      --transition:    all 0.2s ease-in-out;
    }

    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 13px; overflow-x: hidden; line-height: 1.5; -webkit-font-smoothing: antialiased; }

    /* ── Header ── */
    #site-header {
      position: sticky; top: 0; z-index: 200;
      background: var(--bg-header);
      border-bottom: 1px solid rgba(255,255,255,.05);
      box-shadow: 0 1px 0 rgba(255,255,255,.03), 0 4px 24px rgba(0,0,0,.5);
      height: 68px; display: flex; align-items: center; padding: 0 24px; gap: 20px;
    }
    .logo { flex-shrink: 0; display: flex; flex-direction: column; gap: 2px; text-decoration: none; }
    .logo-name { font-size: 1.1rem; font-weight: 800; letter-spacing: .5px; line-height: 1; color: var(--text); }
    .logo-name span { color: var(--orange); }
    .logo-tag { font-size: .52rem; font-weight: 600; letter-spacing: 2.5px; text-transform: uppercase; color: var(--text-muted); line-height: 1; }
    .search-wrap { position: relative; flex: 0 1 260px; }
    .search-wrap .search-icon { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--text-muted); font-size:.85rem; pointer-events:none; }
    .search-input {
      width:100%; padding:8px 12px 8px 34px; border-radius:8px;
      background:var(--bg-input); border:1px solid rgba(255,255,255,.06);
      color:var(--text); font-size:.82rem; outline:none; transition:var(--transition);
    }
    .search-input:focus { border-color:var(--blue); box-shadow: 0 0 0 3px rgba(59,130,246,.12); }
    .search-input::placeholder { color:var(--text-muted); }
    .search-clear {
      position:absolute; right:8px; top:50%; transform:translateY(-50%);
      color:var(--text-muted); cursor:pointer; font-size:.9rem; line-height:1;
      background:none; border:none; padding:2px 4px; transition:var(--transition);
    }
    .search-clear:hover { color:var(--text); }
    .search-results-note { font-size:.75rem; color:var(--text-muted); margin-bottom:12px; }
    .header-nav { display: flex; gap: 2px; flex: 1; align-items: center; }
    .nav-item {
      position: relative; padding: 7px 14px; border-radius: 7px; font-size: .82rem; font-weight: 500;
      color: var(--text-muted); cursor: pointer; transition: var(--transition); user-select: none;
    }
    .nav-item:hover  { color: var(--text-sec); background: rgba(255,255,255,.04); }
    .nav-item.active { color: var(--text); background: rgba(245,197,24,.1); font-weight: 600; }
    .nav-item.active::after { content:''; position:absolute; bottom:-1px; left:50%; transform:translateX(-50%); width:28px; height:2px; background:var(--orange); border-radius:2px 2px 0 0; }
    .nav-item.admin-tab { color: var(--amber); }
    .nav-item.admin-tab.active { background: rgba(245,158,11,.1); }
    .header-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .balance-badge {
      background: rgba(0,200,90,.08); border: 1px solid rgba(0,200,90,.2);
      color: var(--green); font-weight: 700; font-size: .82rem; padding: 6px 14px; border-radius: 20px;
      box-shadow: 0 0 12px rgba(0,200,90,.08);
    }
    .username-tag { font-size: .82rem; color: var(--text-sec); font-weight: 500; }

    /* ── Buttons ── */
    .btn { padding: 8px 18px; border-radius: var(--radius); font-size: .8rem; font-weight: 600; cursor: pointer; border: none; transition: var(--transition); font-family: inherit; letter-spacing: .3px; }
    .btn-sm { padding: 5px 12px; font-size: .72rem; }
    .btn-green   { background: var(--orange); color: #0a0e14; box-shadow: 0 2px 8px rgba(245,197,24,.25); }
    .btn-green:hover   { background: var(--orange-dark); box-shadow: 0 4px 14px rgba(245,197,24,.35); transform: translateY(-1px); }
    .btn-green:disabled { opacity: .4; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-outline { background: transparent; color: var(--text-sec); border: 1px solid rgba(255,255,255,.1); }
    .btn-outline:hover { border-color: var(--orange); color: var(--text); background: rgba(245,197,24,.05); }
    .btn-ghost   { background: transparent; color: var(--text-muted); border: 1px solid rgba(255,255,255,.06); }
    .btn-ghost:hover { border-color: var(--danger); color: var(--danger); background: rgba(239,68,68,.05); }
    .btn-amber { background: rgba(245,158,11,.12); color: var(--amber); border: 1px solid rgba(245,158,11,.25); }
    .btn-amber:hover { background: rgba(245,158,11,.22); border-color: rgba(245,158,11,.4); }
    .btn-red   { background: rgba(239,68,68,.10); color: var(--danger); border: 1px solid rgba(239,68,68,.25); }
    .btn-red:hover   { background: rgba(239,68,68,.20); border-color: rgba(239,68,68,.4); }
    .btn-block { width: 100%; padding: 12px; font-size: .9rem; }

    /* ── Layout ── */
    .container { max-width: 1400px; margin: 0 auto; padding: 24px; display: grid; grid-template-columns: 208px 1fr 316px; gap: 24px; align-items: start; }
    .container.single { grid-template-columns: 1fr; }
    @media (max-width: 1100px) { .container { grid-template-columns: 1fr 300px; } .league-sidebar { display: none; } }
    @media (max-width: 800px)  { .container { grid-template-columns: 1fr; } aside { position: static !important; } }

    .section-title {
      font-size: .65rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
      color: var(--text-muted); margin-bottom: 16px; display: flex; align-items: center; gap: 10px;
    }
    .section-title::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,.05); }

    /* ── League sidebar (left column) ── */
    .league-sidebar { position: sticky; top: 92px; background: var(--bg-card); border: 1px solid rgba(255,255,255,.05); border-radius: 10px; overflow: hidden; box-shadow: var(--shadow-card); }
    .ln-header { font-size: .58rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--text-muted); padding: 12px 12px 10px; border-bottom: 1px solid rgba(255,255,255,.05); margin-bottom: 4px; }
    .ln-item {
      display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 0; cursor: pointer;
      border-left: 2px solid transparent; margin-bottom: 0; user-select: none; transition: var(--transition);
      color: var(--text-muted);
    }
    .ln-item:hover { background: rgba(255,255,255,.04); color: var(--text-sec); }
    .ln-item.active { background: rgba(245,197,24,.07); border-left-color: var(--orange); color: var(--text); }
    .ln-name { font-size: .72rem; font-weight: 500; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ln-count { font-size: .6rem; font-weight: 700; background: rgba(255,255,255,.06); padding: 2px 5px; border-radius: 3px; flex-shrink: 0; }
    .ln-item.active .ln-count { background: rgba(245,197,24,.15); color: var(--orange); }

    /* ── Match card ── */
    .match-card {
      background: var(--bg-card); border: 1px solid rgba(255,255,255,.05); border-radius: 10px;
      padding: 16px 18px; margin-bottom: 8px; transition: var(--transition);
      border-left: 3px solid transparent; box-shadow: var(--shadow-card);
    }
    .match-card:hover { border-color: rgba(245,197,24,.22); border-left-color: var(--orange); box-shadow: var(--shadow-hover), 0 0 0 1px rgba(245,197,24,.06); transform: translateY(-1px); }
    .match-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .league-tag { font-size: .62rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--blue); }
    .league-group { margin-bottom: 24px; }
    .league-group-hdr {
      font-size:.62rem; font-weight:700; letter-spacing:1.5px; text-transform:uppercase;
      color:var(--text-muted); padding:10px 0 8px; display:flex; align-items:center; gap:8px;
    }
    .league-group-hdr::after { content:''; flex:1; height:1px; background:rgba(255,255,255,.05); }
    .match-time { font-size: .72rem; color: var(--text-muted); }
    .match-teams { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; margin-bottom: 16px; }
    .team-name { font-size: 1rem; font-weight: 600; color: var(--text); }
    .team-name.away { text-align: right; }
    .vs-badge { font-size: .68rem; font-weight: 700; color: var(--text-muted); background: rgba(255,255,255,.04); padding: 4px 8px; border-radius: 5px; border: 1px solid rgba(255,255,255,.05); }
    .odds-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
    .odd-btn { background: var(--odds-bg); border: 1px solid rgba(255,255,255,.06); border-radius: var(--radius); padding: 10px 4px; text-align: center; cursor: pointer; transition: var(--transition); display: flex; flex-direction: column; align-items: center; gap: 3px; font-family: inherit; }
    .odd-btn:hover { background: rgba(245,197,24,.09); border-color: rgba(245,197,24,.4); transform: translateY(-1px); box-shadow: 0 4px 10px rgba(0,0,0,.25); }
    .odd-btn.selected { background: var(--odds-sel-bg); border-color: var(--odds-sel-bd); box-shadow: 0 0 0 1px var(--odds-sel-bd), 0 4px 12px rgba(245,197,24,.15); }
    .odd-label { font-size: .58rem; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; color: var(--text-muted); }
    .odd-value { font-size: .95rem; font-weight: 700; color: var(--text); }
    .odd-btn.selected .odd-value { color: var(--orange); }

    /* ── Sidebar ── */
    aside { position: sticky; top: 92px; }
    .sidebar-panel { background: var(--sidebar-bg); border: 1px solid rgba(255,255,255,.05); border-radius: 10px; overflow: hidden; box-shadow: var(--shadow-card); }
    .panel-header { background: rgba(255,255,255,.02); padding: 14px 16px; border-bottom: 1px solid rgba(255,255,255,.05); display: flex; align-items: center; justify-content: space-between; }
    .panel-title { font-size: .65rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--text-sec); }
    .slip-count { background: var(--orange); color: #0a0e14; font-size: .65rem; font-weight: 700; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; display: grid; place-items: center; }
    .auth-tabs { display: grid; grid-template-columns: 1fr 1fr; }
    .auth-tab { padding: 12px; text-align: center; font-size: .78rem; font-weight: 600; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; transition: var(--transition); }
    .auth-tab:hover { color: var(--text-sec); }
    .auth-tab.active { color: var(--text); border-color: var(--orange); }
    .panel-body { padding: 16px; }

    /* ── Forms ── */
    .form-group { margin-bottom: 12px; }
    .form-label { display: block; font-size: .72rem; font-weight: 600; color: var(--text-sec); margin-bottom: 6px; letter-spacing: .3px; }
    .form-input { width: 100%; background: var(--bg-input); border: 1px solid rgba(255,255,255,.08); border-radius: var(--radius); padding: 10px 12px; color: var(--text); font-size: .875rem; font-family: inherit; outline: none; transition: var(--transition); }
    .form-input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(59,130,246,.12); }
    .form-input::placeholder { color: var(--text-muted); }
    .form-error { color: var(--danger); font-size: .72rem; margin-top: 10px; text-align: center; }
    .register-bonus { font-size: .72rem; color: var(--text-muted); text-align: center; margin-top: 10px; line-height: 1.5; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .form-grid .form-group { margin-bottom: 0; }
    .form-grid .form-group.full { grid-column: 1 / -1; }

    /* ── Bet slip ── */
    .bet-selection { background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.07); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 8px; position: relative; transition: var(--transition); }
    .bet-selection:hover { border-color: rgba(255,255,255,.1); }
    .bet-sel-match { font-size: .72rem; color: var(--text-sec); margin-bottom: 5px; }
    .bet-sel-row   { display: flex; align-items: center; justify-content: space-between; }
    .bet-sel-type  { font-size: .8rem; font-weight: 600; }
    .bet-sel-odds  { font-size: .9rem; font-weight: 700; color: var(--orange); }
    .bet-sel-remove { position: absolute; top: 6px; right: 6px; background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: .8rem; padding: 2px 5px; border-radius: 4px; font-family: inherit; transition: var(--transition); }
    .bet-sel-remove:hover { color: var(--danger); background: rgba(239,68,68,.1); }
    .stake-section { margin-top: 14px; }
    .stake-label { font-size: .68rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 7px; }
    .quick-stakes { display: flex; gap: 5px; margin-bottom: 8px; }
    .quick-stake { flex: 1; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.07); border-radius: 6px; padding: 5px 2px; font-size: .72rem; font-weight: 600; color: var(--text-sec); cursor: pointer; text-align: center; transition: var(--transition); font-family: inherit; }
    .quick-stake:hover { border-color: var(--blue); color: var(--text); background: rgba(59,130,246,.07); }
    .stake-wrap { position: relative; margin-bottom: 12px; }
    .stake-sym { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-weight: 600; pointer-events: none; }
    .stake-input { width: 100%; background: var(--bg-input); border: 1px solid rgba(255,255,255,.08); border-radius: var(--radius); padding: 10px 12px 10px 24px; color: var(--text); font-size: .95rem; font-weight: 600; font-family: inherit; outline: none; transition: var(--transition); }
    .stake-input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(0,200,90,.1); }
    .summary-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-top: 1px solid rgba(255,255,255,.05); }
    .sum-label { font-size: .78rem; color: var(--text-muted); }
    .sum-value { font-size: .9rem; font-weight: 700; }
    .sum-value.green { color: var(--green); }
    .slip-empty { text-align: center; padding: 36px 16px; color: var(--text-muted); font-size: .82rem; line-height: 1.6; }
    .slip-empty-icon { font-size: 2rem; margin-bottom: 10px; opacity: .5; }
    .slip-msg { font-size: .75rem; text-align: center; margin-top: 10px; padding: 8px; border-radius: 6px; line-height: 1.4; }
    .slip-msg.success { color: var(--green);  background: rgba(0,200,90,.08);  border: 1px solid rgba(0,200,90,.2); }
    .slip-msg.error   { color: var(--danger); background: rgba(239,68,68,.08); border: 1px solid rgba(239,68,68,.2); }

    /* ── Bet history ── */
    .bet-history-card { background: var(--bg-card); border: 1px solid rgba(255,255,255,.05); border-radius: 10px; padding: 16px 18px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 16px; transition: var(--transition); box-shadow: var(--shadow-card); }
    .bet-history-card:hover { border-color: rgba(59,130,246,.25); box-shadow: var(--shadow-hover); transform: translateY(-1px); }
    .bhc-main { flex: 1; min-width: 0; }
    .bhc-meta { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
    .bhc-teams { font-size: 1rem; font-weight: 600; margin-bottom: 10px; }
    .vs-mini { font-size: .75rem; color: var(--text-muted); margin: 0 4px; }
    .bhc-details { display: flex; gap: 20px; flex-wrap: wrap; }
    .bhc-detail  { display: flex; flex-direction: column; gap: 2px; }
    .bhc-label   { font-size: .6rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); }
    .bhc-value   { font-size: .88rem; font-weight: 600; }
    .bhc-right   { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; flex-shrink: 0; }
    .bhc-date    { font-size: .68rem; color: var(--text-muted); }

    /* ── Status badges ── */
    .status-badge { padding: 3px 10px; border-radius: 20px; font-size: .65rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; border: 1px solid; }
    .status-pending   { color: var(--amber);  border-color: rgba(245,158,11,.3); background: rgba(245,158,11,.08); }
    .status-won       { color: var(--green);  border-color: rgba(0,200,90,.3);   background: rgba(0,200,90,.08); }
    .status-lost      { color: var(--danger); border-color: rgba(239,68,68,.3);  background: rgba(239,68,68,.08); }
    .status-scheduled { color: var(--blue);   border-color: rgba(59,130,246,.3); background: rgba(59,130,246,.06); }
    .status-finished  { color: var(--text-muted); border-color: var(--border); background: transparent; }

    .result-badge { padding: 3px 10px; border-radius: 20px; font-size: .65rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; border: 1px solid; }
    .result-home  { color: var(--green);  border-color: rgba(0,200,90,.3);   background: rgba(0,200,90,.08); }
    .result-draw  { color: var(--amber);  border-color: rgba(245,158,11,.3); background: rgba(245,158,11,.08); }
    .result-away  { color: var(--blue);   border-color: rgba(59,130,246,.3); background: rgba(59,130,246,.06); }
    .settle-status { font-size: .68rem; color: var(--text-muted); margin-top: 4px; }

    /* ── Admin tabs ── */
    .admin-tabs { display: flex; gap: 2px; margin-bottom: 20px; background: var(--bg-input); border: 1px solid rgba(255,255,255,.06); border-radius: 8px; padding: 4px; width: fit-content; }
    .admin-tab-btn { padding: 6px 16px; border-radius: 6px; font-size: .78rem; font-weight: 600; cursor: pointer; border: none; background: transparent; color: var(--text-muted); font-family: inherit; transition: var(--transition); }
    .admin-tab-btn:hover { color: var(--text-sec); background: rgba(255,255,255,.04); }
    .admin-tab-btn.active { background: var(--bg-card); color: var(--text); box-shadow: 0 2px 8px rgba(0,0,0,.4); }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .stat-card { background: var(--bg-card); border: 1px solid rgba(255,255,255,.05); border-radius: 10px; padding: 16px; box-shadow: var(--shadow-card); }
    .stat-label { font-size: .65rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
    .stat-value { font-size: 1.4rem; font-weight: 700; }
    .stat-value.green { color: var(--green); }
    .stat-value.blue  { color: var(--blue); }
    .stat-value.amber { color: var(--amber); }
    .stat-value.red   { color: var(--danger); }

    .data-table-wrap { background: var(--bg-card); border: 1px solid rgba(255,255,255,.05); border-radius: 10px; overflow: hidden; overflow-x: auto; box-shadow: var(--shadow-card); }
    .data-table { width: 100%; border-collapse: collapse; white-space: nowrap; }
    .data-table th { font-size: .63rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); text-align: left; padding: 12px 14px; border-bottom: 1px solid rgba(255,255,255,.05); background: rgba(255,255,255,.02); }
    .data-table td { padding: 12px 14px; border-bottom: 1px solid rgba(255,255,255,.04); font-size: .82rem; vertical-align: middle; color: var(--text-sec); }
    .data-table tr:last-child td { border-bottom: none; }
    .data-table tr:hover td { background: rgba(255,255,255,.02); color: var(--text); }
    .admin-badge { padding: 2px 7px; border-radius: 4px; font-size: .6rem; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; background: rgba(245,158,11,.12); color: var(--amber); border: 1px solid rgba(245,158,11,.3); }

    /* ── Admin panel ── */
    .admin-top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .admin-msg { padding: 10px 14px; border-radius: var(--radius); font-size: .8rem; margin-bottom: 16px; line-height: 1.4; }
    .admin-msg.success { color: var(--green);  background: rgba(0,200,90,.08);  border: 1px solid rgba(0,200,90,.2); }
    .admin-msg.error   { color: var(--danger); background: rgba(239,68,68,.08); border: 1px solid rgba(239,68,68,.2); }

    .admin-card { background: var(--bg-card); border: 1px solid rgba(255,255,255,.05); border-radius: 10px; padding: 16px; margin-bottom: 8px; transition: var(--transition); box-shadow: var(--shadow-card); }
    .admin-card.editing  { border-color: var(--blue); }
    .admin-card.settling { border-color: var(--amber); }
    .ac-header  { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
    .ac-teams   { font-size: 1rem; font-weight: 600; margin-bottom: 6px; }
    .ac-odds    { display: flex; gap: 16px; font-size: .8rem; color: var(--text-sec); margin-bottom: 6px; }
    .ac-odds b  { color: var(--text); }
    .ac-stats   { font-size: .72rem; color: var(--text-muted); }
    .admin-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }

    .settle-section { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
    .settle-label   { font-size: .68rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 8px; }
    .settle-options { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 10px; }
    .settle-btn { padding: 9px 4px; border-radius: var(--radius); background: var(--odds-bg); border: 1px solid transparent; color: var(--text); font-size: .82rem; font-weight: 600; cursor: pointer; text-align: center; transition: var(--transition); font-family: inherit; }
    .settle-btn:hover { background: rgba(59,130,246,.15); border-color: var(--blue); }
    .settle-btn.selected { background: var(--odds-sel-bg); border-color: var(--blue); color: #93c5fd; }

    .add-match-card { background: rgba(59,130,246,.05); border: 1px dashed rgba(59,130,246,.3); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
    .add-match-card .section-title { color: var(--blue); }
    .add-match-card .section-title::after { background: rgba(59,130,246,.2); }

    /* ── Wallet ── */
    .wallet-balance-card { background: linear-gradient(135deg, #0d2137 0%, #0f2942 100%); border: 1px solid rgba(0,200,90,.25); border-radius: 14px; padding: 28px 32px; margin-bottom: 24px; display: flex; align-items: center; justify-content: space-between; }
    .wbc-label  { font-size: .72rem; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
    .wbc-amount { font-size: 2.4rem; font-weight: 700; color: var(--green); letter-spacing: -1px; }
    .wbc-user   { font-size: .85rem; color: var(--text-sec); margin-top: 6px; }

    .wallet-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
    @media (max-width: 640px) { .wallet-grid { grid-template-columns: 1fr; } }

    .wallet-card { background: var(--bg-card); border: 1px solid rgba(255,255,255,.05); border-radius: 10px; padding: 20px; box-shadow: var(--shadow-card); }
    .wallet-card-title { font-size: .72rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }

    .quick-amounts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; }
    .qa-btn { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.07); border-radius: 6px; padding: 7px 4px; font-size: .75rem; font-weight: 600; color: var(--text-sec); cursor: pointer; text-align: center; transition: var(--transition); font-family: inherit; }
    .qa-btn:hover { border-color: var(--blue); color: var(--text); background: rgba(59,130,246,.07); }

    .wallet-result { padding: 9px 12px; border-radius: 6px; font-size: .78rem; font-weight: 500; margin-top: 10px; line-height: 1.4; }
    .wallet-result.success { color: var(--green);  background: rgba(0,200,90,.08);  border: 1px solid rgba(0,200,90,.2); }
    .wallet-result.error   { color: var(--danger); background: rgba(239,68,68,.08); border: 1px solid rgba(239,68,68,.2); }

    /* ── Transaction history ── */
    .tx-table { width: 100%; border-collapse: collapse; }
    .tx-table th { font-size: .65rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); }
    .tx-table td { padding: 11px 12px; border-bottom: 1px solid rgba(30,50,72,.6); font-size: .82rem; vertical-align: middle; }
    .tx-table tr:last-child td { border-bottom: none; }
    .tx-table tr:hover td { background: rgba(255,255,255,.02); }
    .tx-deposit    { color: var(--green);  }
    .tx-withdrawal { color: var(--danger); }
    .tx-type-badge { padding: 2px 8px; border-radius: 20px; font-size: .62rem; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; border: 1px solid; }
    .tx-type-badge.deposit    { color: var(--green);  border-color: rgba(0,200,90,.3);   background: rgba(0,200,90,.08); }
    .tx-type-badge.withdrawal { color: var(--danger); border-color: rgba(239,68,68,.3);  background: rgba(239,68,68,.08); }
    .tx-type-badge.adjustment { color: #a78bfa;       border-color: rgba(167,139,250,.3);background: rgba(167,139,250,.08); }

    .adjust-form-cell { background: rgba(167,139,250,.04); padding: 12px 14px !important; border-top: 1px solid rgba(167,139,250,.2) !important; }
    .adjust-form { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .adjust-input { background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius); padding: 7px 10px; color: var(--text); font-size: .82rem; font-family: inherit; outline: none; transition: var(--transition); width: 130px; }
    .adjust-input:focus { border-color: #a78bfa; }
    .adjust-note  { flex: 1; min-width: 160px; }
    .adjust-msg   { font-size: .75rem; padding: 5px 10px; border-radius: 5px; }
    .adjust-msg.success { color: var(--green);  background: rgba(0,200,90,.08); }
    .adjust-msg.error   { color: var(--danger); background: rgba(239,68,68,.08); }

    /* ── Misc ── */
    .loading-msg { text-align: center; padding: 48px; color: var(--text-muted); font-size: .85rem; }
    .bets-empty  { text-align: center; padding: 60px 20px; color: var(--text-muted); }
    .bets-empty-icon { font-size: 2.5rem; margin-bottom: 14px; }
    .text-link { color: var(--blue); cursor: pointer; }
    .text-link:hover { text-decoration: underline; }

    /* ── Accumulator / bet slip mode tabs ── */
    .slip-mode-tabs { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--border); }
    .slip-mode-tab  { padding: 10px; text-align: center; font-size: .78rem; font-weight: 600; color: var(--text-muted); cursor: pointer; transition: var(--transition); border-bottom: 2px solid transparent; user-select: none; }
    .slip-mode-tab:hover { color: var(--text-sec); background: rgba(255,255,255,.02); }
    .slip-mode-tab.active { color: var(--text); border-color: var(--orange); }
    .acca-odds-display { background: rgba(245,197,24,.06); border: 1px solid rgba(245,197,24,.2); border-radius: var(--radius); padding: 10px 13px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .acca-odds-val { font-size: 1.1rem; font-weight: 800; color: var(--orange); }
    .acca-odds-label { font-size: .65rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); }
    .slip-min-note { font-size: .7rem; color: var(--amber); text-align: center; margin-top: 8px; }

    /* ── Accumulator in My Bets ── */
    .acca-card { background: var(--bg-card); border: 1px solid rgba(255,255,255,.05); border-radius: 10px; padding: 16px 18px; margin-bottom: 8px; transition: var(--transition); box-shadow: var(--shadow-card); }
    .acca-card:hover { border-color: rgba(245,158,11,.28); box-shadow: var(--shadow-hover); transform: translateY(-1px); }
    .acca-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .acca-label { font-size: .65rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--amber); }
    .acca-meta { font-size: .78rem; color: var(--text-sec); margin-left: 8px; }
    .acca-leg { background: rgba(255,255,255,.025); border: 1px solid var(--border); border-radius: 6px; padding: 8px 11px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .acca-leg-info { flex: 1; min-width: 0; }
    .acca-leg-match { font-size: .88rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .acca-leg-meta { font-size: .7rem; color: var(--text-muted); margin-top: 2px; }
    .acca-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 10px; border-top: 1px solid var(--border); margin-top: 6px; }
    .acca-payout { font-size: .88rem; font-weight: 700; color: var(--green); }

    /* ── Mobile FAB ── */
    #mobile-slip-fab {
      display: none;
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: var(--orange); color: #0a0e14; font-weight: 700; font-size: .85rem;
      padding: 13px 28px; border-radius: 4px; border: none; cursor: pointer;
      box-shadow: 0 4px 24px rgba(245,197,24,.4); z-index: 500;
      align-items: center; gap: 8px; font-family: inherit; white-space: nowrap; letter-spacing: .5px;
    }

    /* ── Mobile responsive ── */
    @media (max-width: 800px) {
      .container { padding: 12px; gap: 12px; }
      aside { position: static !important; }
      #mobile-slip-fab { display: flex; }
    }
    @media (max-width: 680px) {
      #site-header { padding: 0 12px; gap: 8px; height: 54px; }
      .logo { font-size: 1.05rem; }
      .search-wrap { flex: 0 1 140px; }
      .search-input { font-size: .75rem; padding: 6px 10px 6px 28px; }
      .header-nav .nav-item { padding: 5px 8px; font-size: .75rem; }
      .balance-badge { padding: 4px 9px; font-size: .75rem; }
      .username-tag { display: none; }
      .header-right .btn { padding: 5px 10px; font-size: .75rem; }
      .match-card { padding: 12px; }
      .team-name { font-size: .9rem; }
      .odd-value { font-size: .88rem; }
    }
    @media (max-width: 460px) {
      .search-wrap { display: none; }
      #site-header { gap: 6px; }
      .nav-item { padding: 5px 7px; font-size: .72rem; }
      .bhc-details { gap: 10px; }
      .wallet-balance-card { padding: 20px; flex-direction: column; gap: 12px; }
      .wbc-amount { font-size: 2rem; }
      .data-table th, .data-table td { padding: 8px 10px; font-size: .75rem; }
    }

    @keyframes pulse-border { 0%,100%{box-shadow:none} 50%{box-shadow:0 0 0 2px var(--blue)} }
    aside.pulse-border .sidebar-panel { animation: pulse-border .5s ease; }

    /* ── Casino ─────────────────────────────────────────────────────────────── */

    /* Jackpot ticker */
    .jackpot-ticker { background:linear-gradient(90deg,rgba(245,197,24,.06),rgba(245,197,24,.1),rgba(245,197,24,.06)); border:1px solid rgba(245,197,24,.18); border-radius:6px; overflow:hidden; margin-bottom:20px; }
    .jackpot-ticker-inner { display:flex; align-items:center; padding:10px 0; white-space:nowrap; animation:jp-scroll 42s linear infinite; }
    .jackpot-ticker:hover .jackpot-ticker-inner { animation-play-state:paused; }
    @keyframes jp-scroll { 0%{transform:translateX(0)} 100%{transform:translateX(-50%)} }
    .jackpot-label { font-size:.56rem; font-weight:700; letter-spacing:2.5px; text-transform:uppercase; color:var(--orange); padding:0 22px; border-right:1px solid rgba(245,197,24,.22); margin-right:26px; flex-shrink:0; }
    .jackpot-item { display:inline-flex; flex-direction:column; gap:1px; margin-right:34px; flex-shrink:0; }
    .jackpot-name { font-size:.52rem; font-weight:600; letter-spacing:1.2px; text-transform:uppercase; color:var(--text-muted); }
    .jackpot-amount { font-size:.88rem; font-weight:700; color:#fbbf24; letter-spacing:.5px; }
    .jackpot-sep { color:rgba(245,197,24,.3); font-size:.7rem; margin-right:10px; align-self:center; }

    /* Casino hero */
    .casino-hero { background:linear-gradient(135deg,#080c12 0%,#120720 55%,#080c12 100%); border:1px solid rgba(255,255,255,.07); border-radius:12px; padding:32px 36px; margin-bottom:24px; position:relative; overflow:hidden; display:flex; align-items:center; gap:32px; }
    .casino-hero::before { content:''; position:absolute; top:-100px; right:160px; width:440px; height:440px; background:radial-gradient(circle,rgba(245,197,24,.06) 0%,transparent 62%); pointer-events:none; }
    .casino-hero::after  { content:''; position:absolute; bottom:-80px; left:10%;  width:320px; height:320px; background:radial-gradient(circle,rgba(168,85,247,.04) 0%,transparent 58%); pointer-events:none; }
    .casino-hero-left { flex:1; min-width:0; position:relative; z-index:1; }
    .casino-eyebrow { display:inline-flex; align-items:center; gap:6px; font-size:.55rem; font-weight:700; letter-spacing:3px; text-transform:uppercase; color:var(--orange); margin-bottom:12px; background:rgba(245,197,24,.08); border:1px solid rgba(245,197,24,.18); padding:4px 10px; border-radius:4px; }
    .casino-hero-title { font-size:1.75rem; font-weight:700; letter-spacing:-.5px; line-height:1.15; margin-bottom:12px; }
    .casino-hero-title span { color:var(--orange); }
    .casino-hero-sub { font-size:.74rem; color:var(--text-muted); line-height:1.8; max-width:440px; margin-bottom:22px; }
    .casino-stats { display:flex; gap:0; margin-bottom:22px; }
    .chs { display:flex; flex-direction:column; gap:2px; padding:0 20px 0 0; margin-right:20px; border-right:1px solid var(--border); }
    .chs:last-child { border-right:none; }
    .chs-val { font-size:1.05rem; font-weight:700; color:var(--text); }
    .chs-lbl { font-size:.52rem; font-weight:600; letter-spacing:1.5px; text-transform:uppercase; color:var(--text-muted); }
    .casino-hero-cta { display:flex; gap:10px; flex-wrap:wrap; }
    .casino-hero-right { flex:0 0 auto; position:relative; width:160px; height:180px; display:flex; align-items:center; justify-content:center; }
    @media (max-width:680px) { .casino-hero-right { display:none; } .casino-hero { padding:24px 20px; } }
    .ch-card { position:absolute; background:linear-gradient(145deg,#1a1f2e,#0e1520); border:1px solid rgba(255,255,255,.1); border-radius:12px; font-size:2.2rem; width:68px; height:90px; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 28px rgba(0,0,0,.55); pointer-events:none; }
    .ch-c1 { transform:rotate(-14deg) translate(-34px,14px); color:#fff;    z-index:1; }
    .ch-c2 { transform:rotate(3deg)  translate(8px,-12px);  color:#fbbf24; z-index:3; box-shadow:0 12px 40px rgba(0,0,0,.6),0 0 30px rgba(251,191,36,.12); border-color:rgba(251,191,36,.18); }
    .ch-c3 { transform:rotate(16deg) translate(38px,10px);  color:#f5c518; z-index:2; }

    /* Category filters */
    .casino-cats { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:24px; }
    .cat-btn { display:inline-flex; align-items:center; gap:5px; padding:8px 20px; border-radius:8px; font-size:.64rem; font-weight:700; letter-spacing:.8px; text-transform:uppercase; border:1px solid rgba(255,255,255,.07); background:rgba(255,255,255,.03); color:var(--text-muted); cursor:pointer; transition:var(--transition); font-family:inherit; }
    .cat-btn:hover { color:var(--text-sec); border-color:rgba(255,255,255,.15); background:rgba(255,255,255,.06); }
    .cat-btn.active { background:var(--orange); color:#0a0e14; border-color:var(--orange); box-shadow:0 4px 16px rgba(245,197,24,.35); }

    /* Section headers */
    .casino-section { margin-bottom:32px; }
    .casino-section-hdr { display:flex; align-items:center; gap:9px; margin-bottom:14px; padding-bottom:10px; border-bottom:1px solid var(--border); }
    .csec-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
    .csec-dot.live  { background:#ef4444; box-shadow:0 0 7px rgba(239,68,68,.7); animation:live-pulse 1.2s ease infinite; }
    .csec-dot.slots { background:#a855f7; box-shadow:0 0 7px rgba(168,85,247,.6); }
    .csec-dot.crash { background:var(--orange); box-shadow:0 0 7px rgba(245,197,24,.6); }
    .csec-dot.cards { background:var(--green); box-shadow:0 0 7px rgba(0,200,90,.6); }
    .csec-title { font-size:.78rem; font-weight:700; letter-spacing:.5px; text-transform:uppercase; color:var(--text-sec); }
    .csec-count { font-size:.62rem; color:var(--text-muted); margin-left:auto; }

    /* Game grid */
    .casino-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:16px; }
    @media (max-width:680px) { .casino-grid { grid-template-columns:repeat(2,1fr); gap:10px; } }
    @media (max-width:380px) { .casino-grid { grid-template-columns:1fr; } }

    /* Game card */
    .game-card { background:var(--bg-card); border:1px solid rgba(255,255,255,.06); border-radius:12px; overflow:hidden; transition:var(--transition); cursor:pointer; box-shadow:var(--shadow-card); }
    .game-card:hover { transform:translateY(-6px); border-color:rgba(245,197,24,.3); box-shadow:var(--shadow-hover), 0 0 0 1px rgba(245,197,24,.07); }
    .game-thumb { height:172px; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; }
    .game-thumb-glow { position:absolute; inset:0; }
    .game-thumb-icon { font-size:3.6rem; position:relative; z-index:1; line-height:1; filter:drop-shadow(0 0 18px currentColor); transition:var(--transition); }
    .game-card:hover .game-thumb-icon { transform:scale(1.1); }
    /* Skeleton loader */
    .game-thumb-skeleton { position:absolute; inset:0; background:linear-gradient(90deg,rgba(255,255,255,.03) 25%,rgba(255,255,255,.07) 50%,rgba(255,255,255,.03) 75%); background-size:200% 100%; animation:skeleton-sweep 1.6s ease-in-out infinite; z-index:5; border-radius:0; }
    @keyframes skeleton-sweep { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
    .game-thumb.loaded .game-thumb-skeleton { display:none; }
    /* Hover overlay */
    .game-thumb-overlay { position:absolute; inset:0; background:rgba(5,8,15,.75); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; opacity:0; transition:var(--transition); z-index:4; pointer-events:none; }
    .game-card:hover .game-thumb-overlay { opacity:1; pointer-events:auto; }
    .btn-play-hover { background:var(--play-btn); color:#fff; border:none; border-radius:50px; padding:12px 28px; font-size:.75rem; font-weight:700; letter-spacing:1px; text-transform:uppercase; cursor:pointer; font-family:inherit; box-shadow:0 0 28px rgba(255,69,0,.45); transform:translateY(8px) scale(.94); transition:var(--transition); pointer-events:none; }
    .game-card:hover .btn-play-hover { transform:translateY(0) scale(1); }
    /* Provider + corner badge on thumbnail */
    .game-provider-tag { position:absolute; bottom:8px; left:8px; font-size:.48rem; font-weight:600; letter-spacing:.5px; text-transform:uppercase; color:rgba(255,255,255,.6); background:rgba(0,0,0,.55); backdrop-filter:blur(6px); border:1px solid rgba(255,255,255,.1); padding:3px 8px; border-radius:4px; z-index:2; }
    .game-badge-thumb { position:absolute; top:8px; right:8px; font-size:.5rem; font-weight:800; letter-spacing:1px; text-transform:uppercase; padding:3px 9px; border-radius:5px; z-index:3; }
    .game-badge-thumb.hot  { background:var(--orange);  color:#0a0e14; box-shadow:0 2px 12px rgba(245,197,24,.5); }
    .game-badge-thumb.new  { background:var(--green);   color:#fff; box-shadow:0 2px 12px rgba(0,200,90,.45); }
    .game-badge-thumb.live { background:#ef4444; color:#fff; box-shadow:0 2px 12px rgba(239,68,68,.5); }
    .game-badge-thumb.live::before { content:'● '; font-size:.4rem; vertical-align:middle; animation:live-pulse 1.2s ease infinite; display:inline; }
    /* Card body */
    .game-body { padding:14px 14px 16px; }
    .game-title { font-size:.9rem; font-weight:700; margin-bottom:5px; letter-spacing:.2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text); }
    .game-players { font-size:.62rem; color:var(--text-muted); margin-bottom:10px; display:flex; align-items:center; gap:5px; }
    .gp-dot { width:5px; height:5px; border-radius:50%; background:var(--green); flex-shrink:0; animation:live-pulse 1.4s ease infinite; }
    .game-features { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:12px; }
    .game-feat { font-size:.5rem; font-weight:600; letter-spacing:.4px; text-transform:uppercase; padding:3px 7px; border-radius:4px; background:rgba(255,255,255,.04); color:var(--text-muted); border:1px solid rgba(255,255,255,.07); white-space:nowrap; }
    .btn-play { width:100%; padding:10px; font-size:.72rem; font-weight:700; letter-spacing:.8px; text-transform:uppercase; background:var(--play-btn); color:#fff; border:none; border-radius:6px; cursor:pointer; transition:var(--transition); font-family:inherit; box-shadow:0 2px 10px rgba(255,69,0,.3); }
    .btn-play:hover { background:var(--play-btn-dark); box-shadow:0 6px 20px rgba(255,69,0,.45); transform:translateY(-1px); }
    /* Strike Studios originals */
    .game-card.strike-original { border-color:rgba(251,191,36,.2); }
    .game-card.strike-original:hover { border-color:rgba(251,191,36,.45); box-shadow:var(--shadow-hover), 0 0 0 1px rgba(251,191,36,.08); }
    .game-card.strike-original .game-provider-tag { color:rgba(251,191,36,.8); border-color:rgba(251,191,36,.22); background:rgba(20,14,0,.6); }
    .strike-original-ribbon { position:absolute; top:0; left:0; background:linear-gradient(135deg,rgba(251,191,36,.92) 0%,rgba(255,140,0,.92) 100%); color:#0a0e14; font-size:.44rem; font-weight:800; letter-spacing:1.2px; text-transform:uppercase; padding:3px 28px 3px 8px; clip-path:polygon(0 0,100% 0,85% 100%,0 100%); z-index:3; }

    /* Casino modal */
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.85); backdrop-filter:blur(8px); z-index:1000; display:flex; align-items:center; justify-content:center; padding:20px; animation:modal-in .2s ease; }
    @keyframes modal-in { from{opacity:0;transform:translateY(16px) scale(.96)} to{opacity:1;transform:translateY(0) scale(1)} }
    .modal-card { background:linear-gradient(160deg,#141c28,#0a0e14); border:1px solid rgba(255,255,255,.08); border-radius:16px; padding:28px; max-width:420px; width:100%; position:relative; box-shadow:0 40px 100px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.04); }
    .modal-card::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,transparent,var(--play-btn),transparent); border-radius:16px 16px 0 0; }
    .modal-close { position:absolute; top:14px; right:14px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); border-radius:6px; color:var(--text-muted); cursor:pointer; font-size:.8rem; padding:5px 10px; font-family:inherit; line-height:1; transition:var(--transition); }
    .modal-close:hover { color:var(--text); background:rgba(255,255,255,.1); border-color:rgba(255,255,255,.16); }
    .modal-eyebrow { font-size:.52rem; font-weight:700; letter-spacing:3px; text-transform:uppercase; color:var(--orange); margin-bottom:16px; }
    .modal-game-header { display:flex; align-items:center; gap:16px; margin-bottom:16px; }
    .modal-icon-wrap { width:64px; height:64px; border-radius:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0; border:1px solid rgba(255,255,255,.08); }
    .modal-icon { font-size:2rem; line-height:1; }
    .modal-game-info { flex:1; min-width:0; }
    .modal-title { font-size:1.05rem; font-weight:700; margin-bottom:3px; }
    .modal-provider { font-size:.62rem; color:var(--text-muted); margin-bottom:6px; }
    .modal-rating { display:flex; align-items:center; gap:4px; font-size:.65rem; color:#fbbf24; }
    .modal-rating-val { font-weight:700; }
    .modal-rating-count { color:var(--text-muted); margin-left:2px; }
    .modal-divider { height:1px; background:var(--border); margin:14px 0; }
    .modal-info-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:14px; }
    .mig-item { display:flex; flex-direction:column; gap:2px; background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.06); border-radius:6px; padding:8px 10px; }
    .mig-label { font-size:.5rem; font-weight:600; letter-spacing:1px; text-transform:uppercase; color:var(--text-muted); }
    .mig-val { font-size:.78rem; font-weight:700; color:var(--text); }
    .modal-features-wrap { display:flex; gap:5px; flex-wrap:wrap; margin-bottom:14px; }
    .mf-chip { font-size:.54rem; font-weight:600; padding:3px 8px; border-radius:4px; background:rgba(245,197,24,.08); color:rgba(255,120,60,.9); border:1px solid rgba(245,197,24,.2); letter-spacing:.3px; }
    .modal-wins-box { background:rgba(0,0,0,.25); border:1px solid rgba(255,255,255,.06); border-radius:8px; padding:10px 12px; margin-bottom:16px; }
    .mw-header { font-size:.54rem; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--text-muted); margin-bottom:8px; }
    .mw-row { display:flex; align-items:center; gap:6px; padding:4px 0; border-bottom:1px solid rgba(255,255,255,.04); font-size:.65rem; }
    .mw-row:last-child { border-bottom:none; padding-bottom:0; }
    .mw-user { font-weight:600; color:var(--text-sec); min-width:44px; }
    .mw-game { flex:1; color:var(--text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .mw-win  { color:var(--green); font-weight:700; margin-left:auto; white-space:nowrap; }
    .mw-time { font-size:.58rem; color:var(--text-muted); white-space:nowrap; }
    .modal-status-line { font-size:.74rem; font-weight:600; color:var(--text-sec); margin-bottom:10px; }
    .modal-status-line em { font-style:normal; color:var(--orange); }
    .modal-progress { height:3px; background:rgba(255,255,255,.06); border-radius:2px; overflow:hidden; margin-bottom:18px; }
    .modal-bar { height:100%; background:linear-gradient(90deg,var(--orange),#ff8c00); border-radius:2px; animation:bar-fill 2.4s ease-out forwards; }
    @keyframes bar-fill { 0%{width:0} 70%{width:80%} 90%{width:92%} 100%{width:92%} }
    .modal-actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; }

    /* ── Live match status ── */
    .match-status-live     { display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:.65rem;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#fff;background:var(--danger);border:1px solid var(--danger); }
    .match-status-live .ms-dot { width:6px;height:6px;border-radius:50%;background:#fff;animation:live-pulse 1s ease infinite;flex-shrink:0; }
    .match-status-halftime { padding:3px 9px;border-radius:20px;font-size:.65rem;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--amber);background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.4); }
    .match-status-finished { padding:3px 9px;border-radius:20px;font-size:.65rem;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text-muted);background:transparent;border:1px solid var(--border); }
    .live-score { display:flex;align-items:center;gap:6px; }
    .score-num  { font-size:1.5rem;font-weight:800;min-width:20px;text-align:center; }
    .score-sep  { font-size:1rem;font-weight:700;color:var(--text-muted); }
    .match-card.in-play  { border-color:rgba(239,68,68,.3); }
    .match-card.halftime { border-color:rgba(245,158,11,.3); }
    .odd-btn.closed { opacity:.45;cursor:default;pointer-events:none; }
    .betting-closed-note { text-align:center;font-size:.68rem;color:var(--text-muted);margin-top:6px;letter-spacing:.3px; }

    .live-ctrl { margin-top:10px;padding:14px;background:rgba(239,68,68,.05);border:1px solid rgba(239,68,68,.2);border-radius:8px; }
    .live-ctrl-title { font-size:.65rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--danger);margin-bottom:12px; }
    .live-ctrl-row  { display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px; }
    .live-ctrl-row:last-child { margin-bottom:0; }
    .score-ctrl { display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:8px;padding:6px 10px; }
    .score-ctrl-label { font-size:.68rem;font-weight:600;color:var(--text-muted);min-width:44px; }
    .score-ctrl-val   { font-size:1.1rem;font-weight:800;min-width:22px;text-align:center; }
    .score-ctrl-btn   { background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:.9rem;font-weight:700;width:24px;height:24px;cursor:pointer;display:grid;place-items:center;font-family:inherit;transition:var(--transition); }
    .score-ctrl-btn:hover { background:rgba(255,255,255,.14); }
    .minute-input { width:64px; }

    /* ── Live odds ── */
    .live-badge { display: inline-flex; align-items: center; gap: 5px; font-size: .62rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--green); margin-left: 8px; }
    .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); flex-shrink: 0; animation: live-pulse 1.4s ease infinite; }
    @keyframes live-pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.35;transform:scale(.75)} }
    @keyframes odds-flash { 0%{background:rgba(245,197,24,.25);border-color:rgba(245,197,24,.7);color:var(--orange)} 100%{} }
    .odd-btn.flash { animation: odds-flash .9s ease-out; }

    .odds-edit-section { margin-top: 10px; padding: 12px; background: rgba(59,130,246,.05); border: 1px solid rgba(59,130,246,.2); border-radius: 8px; }
    .odds-edit-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .odds-edit-row .form-group { margin: 0; }

    /* ── Language toggle ── */
    .lang-toggle { display:flex; align-items:center; gap:2px; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.07); border-radius:6px; padding:2px; flex-shrink:0; }
    .lang-opt { padding:4px 9px; border-radius:5px; font-size:.68rem; font-weight:700; letter-spacing:.5px; cursor:pointer; color:var(--text-muted); transition:var(--transition); border:none; background:none; font-family:inherit; }
    .lang-opt:hover { color:var(--text-sec); }
    .lang-opt.active { background:var(--orange); color:#0a0e14; }

    /* ── Registration Modal ─────────────────────────────────────────────────── */
    .reg-overlay { position:fixed; inset:0; background:rgba(0,0,0,.88); backdrop-filter:blur(14px); z-index:2000; display:flex; align-items:center; justify-content:center; padding:16px; animation:modal-in .22s ease; }
    .reg-modal { display:grid; grid-template-columns:1fr 1fr; max-width:860px; width:100%; border-radius:20px; overflow:hidden; box-shadow:0 48px 120px rgba(0,0,0,.95), 0 0 0 1px rgba(255,255,255,.06); max-height:calc(100vh - 32px); }
    .reg-form-panel { background:#12161f; padding:36px 32px; position:relative; display:flex; flex-direction:column; overflow-y:auto; }
    .reg-close { position:absolute; top:14px; right:14px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); color:var(--text-muted); border-radius:8px; cursor:pointer; font-size:.78rem; padding:5px 11px; font-family:inherit; transition:var(--transition); line-height:1.4; }
    .reg-close:hover { color:var(--text); background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.2); }
    .reg-logo { margin-bottom:24px; }
    .reg-logo-name { font-size:1.1rem; font-weight:800; color:var(--text); letter-spacing:.5px; }
    .reg-logo-name span { color:var(--orange); }
    .reg-logo-tag { font-size:.45rem; font-weight:600; letter-spacing:2.5px; text-transform:uppercase; color:var(--text-muted); margin-top:2px; }
    .reg-steps { display:flex; align-items:center; gap:8px; margin-bottom:22px; }
    .reg-step { display:flex; align-items:center; gap:7px; }
    .reg-step-num { width:22px; height:22px; border-radius:50%; display:grid; place-items:center; font-size:.62rem; font-weight:700; border:1.5px solid rgba(255,255,255,.14); color:var(--text-muted); transition:var(--transition); flex-shrink:0; }
    .reg-step-num.active { background:var(--orange); color:#0a0e14; border-color:var(--orange); }
    .reg-step-num.done   { background:var(--green);  color:#fff;     border-color:var(--green); }
    .reg-step-label { font-size:.6rem; font-weight:600; color:var(--text-muted); letter-spacing:.5px; text-transform:uppercase; }
    .reg-step-label.active { color:var(--text); }
    .reg-step-sep { flex:1; height:1px; background:rgba(255,255,255,.08); min-width:20px; }
    .reg-title { font-size:1.15rem; font-weight:700; color:var(--text); margin-bottom:5px; }
    .reg-sub { font-size:.7rem; color:var(--text-muted); line-height:1.6; margin-bottom:20px; }
    .reg-field { margin-bottom:13px; }
    .reg-label { display:block; font-size:.68rem; font-weight:600; color:var(--text-sec); margin-bottom:6px; letter-spacing:.3px; }
    .reg-label .req { color:var(--danger); margin-left:2px; }
    .reg-input { width:100%; background:#0d1117; border:1px solid rgba(255,255,255,.08); border-radius:8px; padding:11px 14px; color:var(--text); font-size:.875rem; font-family:inherit; outline:none; transition:var(--transition); }
    .reg-input:focus { border-color:var(--orange); box-shadow:0 0 0 3px rgba(245,197,24,.1); }
    .reg-input::placeholder { color:var(--text-muted); }
    .reg-field-err { font-size:.64rem; color:var(--danger); margin-top:5px; display:none; }
    .reg-field.has-error .reg-field-err { display:block; }
    .reg-field.has-error .reg-input { border-color:var(--danger); box-shadow:0 0 0 2px rgba(239,68,68,.12); }
    .reg-bonus-toggle { display:flex; align-items:center; gap:8px; cursor:pointer; padding:9px 13px; border:1px dashed rgba(245,197,24,.28); border-radius:8px; margin-bottom:14px; transition:var(--transition); background:rgba(245,197,24,.04); user-select:none; }
    .reg-bonus-toggle:hover { border-color:rgba(245,197,24,.5); background:rgba(245,197,24,.07); }
    .reg-bonus-label { font-size:.7rem; font-weight:600; color:rgba(245,197,24,.85); flex:1; }
    .reg-bonus-arrow { font-size:.65rem; color:var(--text-muted); transition:transform .2s ease; }
    .reg-bonus-toggle.open .reg-bonus-arrow { transform:rotate(180deg); }
    .reg-bonus-input-wrap { display:none; margin-bottom:14px; }
    .reg-bonus-input-wrap.open { display:block; animation:modal-in .15s ease; }
    .reg-checks { display:flex; flex-direction:column; gap:10px; margin-bottom:18px; }
    .reg-check-label { display:flex; align-items:flex-start; gap:10px; cursor:pointer; font-size:.68rem; color:var(--text-muted); line-height:1.5; }
    .reg-check-label input[type=checkbox] { display:none; }
    .reg-check-box { width:17px; height:17px; border:1.5px solid rgba(255,255,255,.2); border-radius:4px; flex-shrink:0; display:grid; place-items:center; transition:var(--transition); margin-top:1px; background:rgba(255,255,255,.03); }
    .reg-check-label input:checked ~ .reg-check-box { background:var(--orange); border-color:var(--orange); }
    .reg-check-label input:checked ~ .reg-check-box::after { content:'✓'; font-size:.55rem; font-weight:900; color:#0a0e14; }
    .reg-check-text a { color:var(--orange); text-decoration:none; }
    .reg-check-text a:hover { text-decoration:underline; }
    .reg-tos-err { font-size:.64rem; color:var(--danger); margin-top:-10px; margin-bottom:12px; display:none; }
    .reg-tos-err.show { display:block; }
    .reg-error-global { background:rgba(239,68,68,.08); border:1px solid rgba(239,68,68,.22); border-radius:7px; padding:9px 13px; font-size:.73rem; color:var(--danger); margin-bottom:14px; text-align:center; display:none; line-height:1.5; }
    .reg-error-global.show { display:block; }
    .reg-btn-primary { width:100%; padding:13px; background:var(--orange); color:#0a0e14; border:none; border-radius:8px; font-size:.86rem; font-weight:700; cursor:pointer; font-family:inherit; letter-spacing:.6px; transition:var(--transition); margin-bottom:14px; }
    .reg-btn-primary:hover:not(:disabled) { background:var(--orange-dark); box-shadow:0 6px 22px rgba(245,197,24,.42); transform:translateY(-1px); }
    .reg-btn-primary:disabled { opacity:.5; cursor:not-allowed; }
    .reg-login-link { text-align:center; font-size:.7rem; color:var(--text-muted); }
    .reg-login-link a { color:var(--orange); cursor:pointer; text-decoration:none; font-weight:600; }
    .reg-login-link a:hover { text-decoration:underline; }
    /* Bonus panel */
    .reg-bonus-panel { background:linear-gradient(160deg,#08060f 0%,#140928 45%,#0e0619 70%,#08060f 100%); padding:40px 28px; display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; overflow:hidden; text-align:center; }
    .reg-bonus-panel::before { content:''; position:absolute; top:-130px; right:-90px; width:420px; height:420px; background:radial-gradient(circle,rgba(245,197,24,.08) 0%,transparent 58%); pointer-events:none; }
    .reg-bonus-panel::after  { content:''; position:absolute; bottom:-110px; left:-70px; width:340px; height:340px; background:radial-gradient(circle,rgba(168,85,247,.06) 0%,transparent 56%); pointer-events:none; }
    .rbp-logo { font-size:1.25rem; font-weight:800; color:var(--text); letter-spacing:.5px; margin-bottom:2px; position:relative; z-index:1; }
    .rbp-logo span { color:var(--orange); }
    .rbp-logo-tag { font-size:.43rem; font-weight:600; letter-spacing:2.5px; text-transform:uppercase; color:var(--text-muted); margin-bottom:28px; position:relative; z-index:1; }
    .rbp-badge { display:inline-flex; align-items:center; gap:6px; background:rgba(245,197,24,.1); border:1px solid rgba(245,197,24,.28); border-radius:20px; padding:5px 14px; font-size:.52rem; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--orange); margin-bottom:12px; position:relative; z-index:1; }
    .rbp-offer-label { font-size:.58rem; font-weight:600; letter-spacing:1.5px; text-transform:uppercase; color:var(--text-muted); margin-bottom:20px; position:relative; z-index:1; }
    .rbp-icons { display:flex; gap:18px; justify-content:center; margin-bottom:22px; font-size:2rem; position:relative; z-index:1; }
    .rbp-icon { display:inline-block; animation:rbp-float 3s ease-in-out infinite; filter:drop-shadow(0 0 10px currentColor); }
    .rbp-icon:nth-child(2) { animation-delay:.8s; }
    .rbp-icon:nth-child(3) { animation-delay:1.6s; }
    @keyframes rbp-float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-9px)} }
    .rbp-amount { font-size:2.8rem; font-weight:800; color:#fff; letter-spacing:-1.5px; line-height:1; margin-bottom:5px; position:relative; z-index:1; }
    .rbp-amount span { color:var(--orange); }
    .rbp-plus { font-size:1.5rem; font-weight:700; color:#fff; opacity:.5; margin-bottom:4px; position:relative; z-index:1; }
    .rbp-spins { font-size:1.2rem; font-weight:700; color:#a78bfa; margin-bottom:26px; position:relative; z-index:1; letter-spacing:.3px; }
    .rbp-divider { width:40px; height:2px; background:linear-gradient(90deg,transparent,rgba(245,197,24,.5),transparent); margin:0 auto 20px; position:relative; z-index:1; }
    .rbp-disclaimer { font-size:.52rem; color:var(--text-muted); line-height:1.7; max-width:210px; margin:0 auto; position:relative; z-index:1; }
    .rbp-disclaimer a { color:rgba(245,197,24,.55); text-decoration:none; }
    .rbp-deco { position:absolute; border-radius:50%; pointer-events:none; }
    @media (max-width:680px) { .reg-modal { grid-template-columns:1fr; max-width:440px; } .reg-bonus-panel { display:none; } .reg-form-panel { padding:28px 22px; } }
    @media (max-width:400px) { .reg-form-panel { padding:22px 16px; } }

    /* ── Toast ── */
    #toast-root { position:fixed; bottom:24px; right:24px; z-index:3000; display:flex; flex-direction:column; gap:8px; pointer-events:none; }
    .toast { background:var(--bg-card); border:1px solid var(--border-strong); border-left:3px solid var(--orange); border-radius:8px; padding:11px 16px; font-size:.8rem; color:var(--text); box-shadow:var(--shadow-hover); max-width:300px; animation:toast-in .25s ease; pointer-events:auto; }
    .toast.warn { border-left-color:var(--amber); }
    .toast.success { border-left-color:var(--green); }
    .toast.error { border-left-color:var(--danger); }
    @keyframes toast-in { from{opacity:0;transform:translateX(20px)} to{opacity:1;transform:translateX(0)} }
    @media (max-width:680px){ #toast-root{ left:12px; right:12px; bottom:80px; } .toast{ max-width:none; } }

    /* ── Email verify banner ── */
    .verify-banner { background:rgba(245,158,11,.1); border:1px solid rgba(245,158,11,.3); color:var(--amber); font-size:.74rem; font-weight:600; padding:6px 12px; border-radius:6px; display:inline-flex; align-items:center; gap:8px; }
    .verify-banner button { background:rgba(245,158,11,.2); border:1px solid rgba(245,158,11,.4); color:var(--amber); border-radius:5px; font-size:.68rem; font-weight:700; padding:3px 9px; cursor:pointer; font-family:inherit; }
    .verify-banner button:hover { background:rgba(245,158,11,.3); }

    /* ── Bonus & RG cards ── */
    .bonus-balance-badge { display:inline-block; background:rgba(0,200,90,.1); border:1px solid rgba(0,200,90,.3); color:var(--green); font-weight:800; font-size:1.4rem; padding:8px 18px; border-radius:10px; }
    .wager-bar-wrap { height:10px; background:rgba(255,255,255,.06); border-radius:6px; overflow:hidden; margin:10px 0 6px; }
    .wager-bar { height:100%; background:linear-gradient(90deg,var(--green),var(--orange)); border-radius:6px; transition:width .4s ease; }
    .wager-bar-label { font-size:.72rem; color:var(--text-muted); }

    .rg-section { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px; }
    @media (max-width:640px){ .rg-section { grid-template-columns:1fr; } }
    .rg-inputs-row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:10px; }
    .rg-excl-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
    .rg-excl-btn { padding:11px 8px; border-radius:8px; background:rgba(239,68,68,.08); border:1px solid rgba(239,68,68,.3); color:var(--danger); font-size:.78rem; font-weight:700; cursor:pointer; font-family:inherit; transition:var(--transition); }
    .rg-excl-btn:hover { background:rgba(239,68,68,.18); border-color:rgba(239,68,68,.5); }
    .rg-current { font-size:.72rem; color:var(--text-sec); margin-top:8px; line-height:1.6; }

    /* ── Score center ── */
    .score-card { background:var(--bg-card); border:1px solid rgba(255,255,255,.05); border-radius:12px; padding:18px 20px; margin-bottom:10px; box-shadow:var(--shadow-card); transition:var(--transition); }
    .score-card.score-center-live { border-left:3px solid var(--danger); }
    .score-card:hover { box-shadow:var(--shadow-hover); transform:translateY(-1px); }
    .score-card-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
    .score-teams-row { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:14px; margin-bottom:14px; }
    .score-team { font-size:1.05rem; font-weight:700; }
    .score-team.away { text-align:right; }
    .score-big { display:flex; align-items:center; gap:10px; }

const $   = id => document.getElementById(id);
const esc = s  => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmt = n  => '€' + parseFloat(n).toFixed(2);

function t(key) { return TRANSLATIONS[state.lang]?.[key] ?? TRANSLATIONS.en[key] ?? key; }
function setLang(lang) { state.lang = lang; localStorage.setItem('bet_lang', lang); render(); }
function txTypeLabel(type) {
  const map = { deposit: t('tx_dep'), withdrawal: t('tx_wd'), adjustment: t('tx_adj') };
  return map[type] || type;
}
function statusLabel(s) {
  const map = { pending: t('status_pending'), won: t('status_won'), lost: t('status_lost') };
  return map[s] || s;
}

function leagueShortName(name) {
  if (!name) return t('nav_football');
  return name.replace(/ - [A-Za-z ]+$/, '').replace(/^UEFA /, '');
}

function formatDate(iso) {
  const d = new Date(iso);
  const loc = state.lang === 'el' ? 'el-GR' : 'en-GB';
  return d.toLocaleDateString(loc, { day: '2-digit', month: 'short' })
    + ' · ' + d.toLocaleTimeString(loc, { hour: '2-digit', minute: '2-digit' });
}
function toDatetimeLocal(iso) { return new Date(iso).toISOString().slice(0, 16); }

function showToast(text, type = 'warn', ms = 3500) {
  const root = $('toast-root'); if (!root) return;
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = text;
  root.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateX(20px)'; el.style.transition = 'all .3s ease'; setTimeout(() => el.remove(), 300); }, ms);
}

function isMatchOpen(m) { return ['scheduled', 'live', 'halftime'].includes(m.status); }

function isToday(iso) {
  const d = new Date(iso), n = new Date();
  return d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth() && d.getDate() === n.getDate();
}

// ─── API ─────────────────────────────────────────────────────────────────────
let _refreshing = false;
let _refreshPromise = null;

async function _doRefresh() {
  const rt = localStorage.getItem('bet_refresh_token');
  if (!rt) throw new Error('No refresh token');
  const res = await fetch('/api/refresh', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ refreshToken: rt }),
  });
  if (!res.ok) throw new Error('Refresh failed');
  const data = await res.json();
  state.token = data.token;
  localStorage.setItem('bet_token', data.token);
  if (data.refreshToken) localStorage.setItem('bet_refresh_token', data.refreshToken);
}

async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (state.token) headers['Authorization'] = `Bearer ${state.token}`;
  const res = await fetch(path, { ...opts, headers });

  if (res.status === 401 && !opts._retry) {
    try {
      if (!_refreshing) {
        _refreshing = true;
        _refreshPromise = _doRefresh().finally(() => { _refreshing = false; });
      }
      await _refreshPromise;
      return api(path, { ...opts, _retry: true });
    } catch {
      state.token = null; state.user = null;
      localStorage.removeItem('bet_token');
      localStorage.removeItem('bet_refresh_token');
      render();
      throw new Error('Session expired. Please log in again.');
    }
  }

  const data = await res.json();
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

async function login() {
  const username = $('auth-username')?.value?.trim();
  const password = $('auth-password')?.value?.trim();
  if (!username || !password) { state.authError = 'All fields are required'; renderSidebar(); return; }
  try {
    applyAuthSuccess(await api('/api/login', { method: 'POST', body: JSON.stringify({ username, password }) }));
  } catch (err) { state.authError = err.message; renderSidebar(); }
}

async function register() {
  const username = $('auth-username')?.value?.trim();
  const email    = $('auth-email')?.value?.trim();
  const password = $('auth-password')?.value?.trim();
  if (!username || !email || !password) { state.authError = 'All fields are required'; renderSidebar(); return; }
  try {
    applyAuthSuccess(await api('/api/register', { method: 'POST', body: JSON.stringify({ username, email, password }) }));
    claimWelcomeBonus(true).then(() => { renderHeader(); });
  } catch (err) { state.authError = err.message; renderSidebar(); }
}

function applyAuthSuccess(data) {
  state.token = data.token; state.user = data.user; state.authError = null;
  localStorage.setItem('bet_token', data.token);
  if (data.refreshToken) localStorage.setItem('bet_refresh_token', data.refreshToken);
  render();
  startRealityCheck();
}

async function submitResetPassword(token) {
  const pw1 = $('reset-pw1')?.value, pw2 = $('reset-pw2')?.value;
  const msg = $('reset-msg');
  if (!pw1 || pw1.length < 6) { if (msg) msg.innerHTML = `<div class="slip-msg error">Password must be at least 6 characters</div>`; return; }
  if (pw1 !== pw2) { if (msg) msg.innerHTML = `<div class="slip-msg error">Passwords do not match</div>`; return; }
  try {
    const res = await api('/api/reset-password', { method: 'POST', body: JSON.stringify({ token, newPassword: pw1 }) });
    $('modal-root').innerHTML = '';
    showToast(res.message || t('reset_success'), 'success', 5000);
    // Clear the reset param from URL
    history.replaceState({}, '', location.pathname);
    state.authTab = 'login'; renderSidebar();
  } catch (err) { if (msg) msg.innerHTML = `<div class="slip-msg error">${esc(err.message)}</div>`; }
}

async function handleUrlTokens() {
  const params = new URLSearchParams(location.search);
  const verifyTok = params.get('verify');
  const resetTok  = params.get('reset');
  if (verifyTok) {
    try {
      const res = await api('/api/verify-email', { method: 'POST', body: JSON.stringify({ token: verifyTok }) });
      showToast(res.message || t('verify_success'), 'success', 5000);
      if (state.token) { await loadUser(); render(); }
    } catch (err) { showToast(err.message, 'error', 5000); }
    history.replaceState({}, '', location.pathname);
  }
  if (resetTok) {
    openResetPasswordModal(resetTok);
  }
}

// ─── Live odds stream ─────────────────────────────────────────────────────────
function connectOddsStream() {
  const src = new EventSource('/api/odds-stream');

  src.addEventListener('snapshot', e => {
    const fresh = JSON.parse(e.data);
    fresh.forEach(m => {
      const i = state.matches.findIndex(x => x.id === m.id);
      if (i > -1) Object.assign(state.matches[i], m); else state.matches.push(m);
    });
    if (state.view === 'matches') { renderLeagueNav(); renderMatchList(); }
    if (state.view === 'scores') renderScoresView();
  });

  src.addEventListener('match-update', e => {
    const m = JSON.parse(e.data);
    // Patch user-facing match list
    const i = state.matches.findIndex(x => x.id === m.id);
    if (i > -1) Object.assign(state.matches[i], m); else state.matches.push(m);
    // Patch admin match list in-place (preserves stats columns from admin query)
    const j = state.adminMatches.findIndex(x => x.id === m.id);
    if (j > -1) Object.assign(state.adminMatches[j], m);
    // Flash odds only if status is still scheduled
    if (m.status === 'scheduled') {
      state.flashingOdds.add(m.id);
      setTimeout(() => { state.flashingOdds.delete(m.id); }, 900);
    }
    if (state.view === 'matches') renderMatchList();
    if (state.view === 'scores') renderScoresView();
    if (state.view === 'admin' && state.adminTab === 'matches') renderAdminMatchList();
  });

  src.onerror = () => {}; // EventSource auto-reconnects
}

// ─── Bet slip ────────────────────────────────────────────────────────────────
function isSelected(matchId, betType) { return state.betSlip.some(b => b.matchId === String(matchId) && b.betType === betType); }

function toggleBet(matchId, betType, odds) {
  if (!state.token) {
    const s = $('sidebar');
    if (s) { s.classList.add('pulse-border'); setTimeout(() => s.classList.remove('pulse-border'), 600); }
    $('auth-username')?.focus(); return;
  }
  const idx = state.betSlip.findIndex(b => b.matchId === String(matchId) && b.betType === betType);
  if (idx > -1) { state.betSlip.splice(idx, 1); }
  else {
    state.betSlip = state.betSlip.filter(b => b.matchId !== String(matchId));
    const m = state.matches.find(m => String(m.id) === String(matchId));
    const live = m && isMatchLive(m);
    state.betSlip.push({ matchId: String(matchId), home: m.home_team, away: m.away_team, betType, odds: parseFloat(odds), live });
    if (live) showToast(t('live_odds_warn'), 'warn');
  }
  state.msg = null; render();
}

function removeBet(matchId) { state.betSlip = state.betSlip.filter(b => b.matchId !== String(matchId)); render(); }

async function placeAllBets() {
  const stake = parseFloat($('stake-input')?.value);
  if (!stake || stake <= 0) { state.msg = { type: 'error', text: 'Enter a valid stake amount.' }; renderSidebar(); return; }
  const totalStake = stake * state.betSlip.length;
  if (totalStake > parseFloat(state.user.balance)) {
    state.msg = { type: 'error', text: `Need ${fmt(totalStake)}, balance is ${fmt(state.user.balance)}.` }; renderSidebar(); return;
  }
  state.placing = true; renderSidebar();
  let placed = 0, failed = 0, newBalance = null;
  for (const bet of [...state.betSlip]) {
    try {
      const res = await api('/api/place-bet', { method: 'POST', body: JSON.stringify({ match_id: parseInt(bet.matchId), bet_type: bet.betType, amount: stake }) });
      placed++; newBalance = res.new_balance;
    } catch { failed++; }
  }
  if (newBalance !== null) state.user = { ...state.user, balance: newBalance };
  state.placing = false;
  if (placed > 0) {
    state.betSlip = []; state.myBets = [];
    state.msg = { type: 'success', text: failed === 0 ? `✓ ${placed} bet${placed > 1 ? 's' : ''} placed! Balance: ${fmt(newBalance)}` : `${placed} placed, ${failed} failed. Balance: ${fmt(newBalance)}` };
    // Refresh user so bonus balance / wagering progress stay in sync
    loadUser().then(() => renderHeader());
  } else {
    state.msg = { type: 'error', text: 'Could not place bets. Please try again.' };
  }
  render();
}

async function placeAccumulator() {
  const stake = parseFloat($('stake-input')?.value);
  if (!stake || stake <= 0) { state.msg = { type: 'error', text: 'Enter a valid stake amount.' }; renderSidebar(); return; }
  if (state.betSlip.length < 2) { state.msg = { type: 'error', text: 'Add at least 2 selections for an accumulator.' }; renderSidebar(); return; }
  if (stake > parseFloat(state.user.balance)) { state.msg = { type: 'error', text: `Insufficient balance (${fmt(state.user.balance)}).` }; renderSidebar(); return; }
  state.placing = true; renderSidebar();
  try {
    const legs = state.betSlip.map(b => ({ match_id: parseInt(b.matchId), bet_type: b.betType }));
    const res = await api('/api/place-accumulator', { method: 'POST', body: JSON.stringify({ legs, stake }) });
    state.user = { ...state.user, balance: res.new_balance };
    state.betSlip = []; state.myBets = [];
    state.msg = { type: 'success', text: `✓ Accumulator placed! ${res.legs} legs @ ${res.combined_odds}x → max ${fmt(res.potential_payout)}. Balance: ${fmt(res.new_balance)}` };
    loadUser().then(() => renderHeader());
  } catch (err) {
    state.msg = { type: 'error', text: err.message };
  }
  state.placing = false;
  render();
}

    state.settlingMatchId = null; state.settleResult = null;
    state.adminMsg = { type: 'success', text: res.message };
    await loadAdminMatches();
    await loadMatches();
    renderAdminView();
  } catch (err) { state.adminMsg = { type: 'error', text: err.message }; renderAdminView(); }
}
