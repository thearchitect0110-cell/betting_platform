function renderMatchCard(m) {
  const isLive     = m.status === 'live';
  const isHalftime = m.status === 'halftime';
  const isFinished = m.status === 'finished';
  const isOpen     = m.status === 'scheduled';
  const hasScore   = m.home_score !== null && m.away_score !== null;
  const flash      = state.flashingOdds.has(m.id);

  const statusBadge = isLive
    ? `<span class="match-status-live"><span class="ms-dot"></span>${t('status_live')||'LIVE'}${m.match_minute ? ' ' + m.match_minute + "'" : ''}</span>`
    : isHalftime ? `<span class="match-status-halftime">◐ ${t('status_halftime')}</span>`
    : isFinished ? `<span class="match-status-finished">${t('status_fulltime')}</span>`
    : `<span class="match-time">${formatDate(m.match_date)}</span>`;

  const midDisplay = hasScore
    ? `<div class="live-score"><span class="score-num">${m.home_score}</span><span class="score-sep">-</span><span class="score-num">${m.away_score}</span></div>`
    : `<div class="vs-badge">VS</div>`;

  // Live in-play betting: only finished matches are closed; live/halftime stay open.
  const liveBet      = isLive || isHalftime;
  const oddsDisabled = isFinished;
  return `
  <div class="match-card${isLive ? ' in-play' : isHalftime ? ' halftime' : ''}">
    <div class="match-header">
      <span class="league-tag">⚽ ${esc(leagueShortName(m.league_name))}</span>
      ${statusBadge}
    </div>
    <div class="match-teams">
      <div class="team-name">${esc(m.home_team)}</div>
      ${midDisplay}
      <div class="team-name away">${esc(m.away_team)}</div>
    </div>
    <div class="odds-row">
      <button class="odd-btn ${isSelected(m.id,'home') ? 'selected' : ''} ${flash ? 'flash' : ''} ${oddsDisabled ? 'closed' : ''}" ${oddsDisabled ? '' : `data-action="bet" data-match="${m.id}" data-type="home" data-odds="${m.home_odds}" data-live="${liveBet?'1':''}"`}>
        <span class="odd-label">${t('odd_home')}</span><span class="odd-value">${parseFloat(m.home_odds).toFixed(2)}</span>
      </button>
      <button class="odd-btn ${isSelected(m.id,'draw') ? 'selected' : ''} ${flash ? 'flash' : ''} ${oddsDisabled ? 'closed' : ''}" ${oddsDisabled ? '' : `data-action="bet" data-match="${m.id}" data-type="draw" data-odds="${m.draw_odds}" data-live="${liveBet?'1':''}"`}>
        <span class="odd-label">${t('odd_draw')}</span><span class="odd-value">${parseFloat(m.draw_odds).toFixed(2)}</span>
      </button>
      <button class="odd-btn ${isSelected(m.id,'away') ? 'selected' : ''} ${flash ? 'flash' : ''} ${oddsDisabled ? 'closed' : ''}" ${oddsDisabled ? '' : `data-action="bet" data-match="${m.id}" data-type="away" data-odds="${m.away_odds}" data-live="${liveBet?'1':''}"`}>
        <span class="odd-label">${t('odd_away')}</span><span class="odd-value">${parseFloat(m.away_odds).toFixed(2)}</span>
      </button>
    </div>
    ${liveBet ? `<div class="betting-closed-note" style="color:var(--green)"><span class="live-dot" style="display:inline-block;vertical-align:middle;margin-right:5px"></span>${t('live_bet')} — ${t('live_odds_warn')}</div>` : ''}
    ${oddsDisabled ? `<div class="betting-closed-note">${t('betting_closed')}</div>` : ''}
  </div>`;
}

function renderMatchList() {
  const el = $('matches-list'); if (!el) return;

  const q = state.searchQuery.trim().toLowerCase();

  let visible = state.activeLeague
    ? state.matches.filter(m => m.sport_key === state.activeLeague)
    : state.matches;

  if (q) {
    visible = visible.filter(m =>
      m.home_team.toLowerCase().includes(q) ||
      m.away_team.toLowerCase().includes(q)
    );
  }

  if (!visible.length) {
    el.innerHTML = q
      ? `<div class="loading-msg">${state.lang==='el'?`Δεν βρέθηκαν αγώνες για "<strong>${esc(q)}</strong>".`:`No matches found for "<strong>${esc(q)}</strong>".`}</div>`
      : `<div class="loading-msg">${t('no_matches')}</div>`;
    return;
  }

  const resultsNote = q
    ? `<div class="search-results-note">${state.lang==='el'?`${visible.length} αγώνες για "<strong>${esc(q)}</strong>"`:visible.length+' match'+(visible.length!==1?'es':'')+' for "<strong>'+esc(q)+'</strong>"'}</div>`
    : '';

  // When searching, skip grouping and show flat list across all leagues
  if (q || state.activeLeague) {
    el.innerHTML = resultsNote + visible.map(renderMatchCard).join('');
  } else {
    const groups = new Map();
    for (const m of visible) {
      const key = m.league_name || 'Other';
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(m);
    }
    el.innerHTML = [...groups.entries()].map(([name, ms]) =>
      `<div class="league-group">
        <div class="league-group-hdr">⚽ ${esc(leagueShortName(name))}</div>
        ${ms.map(renderMatchCard).join('')}
      </div>`
    ).join('');
  }
}

function renderBetsList() {
  const el = $('bets-list'); if (!el) return;
  if (!state.myBets.length) {
    el.innerHTML = `<div class="bets-empty"><div class="bets-empty-icon">🎯</div><div style="font-size:1rem;font-weight:600;margin-bottom:8px;color:var(--text)">${t('no_bets')}</div><div style="font-size:.82rem">${t('no_bets_go')} <span class="text-link" data-action="view-matches">${t('nav_football')}</span> ${t('no_bets_place')}</div></div>`; return;
  }

  // Separate singles from accumulator legs
  const singles = state.myBets.filter(b => !b.accumulator_id);
  const accaMap = new Map();
  for (const b of state.myBets) {
    if (!b.accumulator_id) continue;
    if (!accaMap.has(b.accumulator_id)) accaMap.set(b.accumulator_id, []);
    accaMap.get(b.accumulator_id).push(b);
  }

  const singlesHtml = singles.map(b => {
    const pickLabel = b.bet_type === 'home' ? t('pick_home') : b.bet_type === 'away' ? t('pick_away') : t('pick_draw');
    return `
      <div class="bet-history-card">
        <div class="bhc-main">
          <div class="bhc-meta"><span class="league-tag">⚽ ${esc(leagueShortName(b.league_name))}</span><span class="match-time">${formatDate(b.match_date)}</span>${b.is_live?`<span class="live-badge" style="color:var(--danger)"><span class="live-dot" style="background:var(--danger)"></span>${t('live_bet')}</span>`:''}</div>
          <div class="bhc-teams">${esc(b.home_team)} <span class="vs-mini">vs</span> ${esc(b.away_team)}</div>
          <div class="bhc-details">
            <div class="bhc-detail"><span class="bhc-label">${t('lbl_pick')}</span><span class="bhc-value">${pickLabel}</span></div>
            <div class="bhc-detail"><span class="bhc-label">${t('lbl_odds')}</span><span class="bhc-value">${parseFloat(b.odds).toFixed(2)}</span></div>
            <div class="bhc-detail"><span class="bhc-label">${t('lbl_stake')}</span><span class="bhc-value">${fmt(b.amount)}</span></div>
            <div class="bhc-detail"><span class="bhc-label">${t('lbl_potential')}</span><span class="bhc-value" style="color:var(--green)">${fmt(parseFloat(b.amount) * parseFloat(b.odds))}</span></div>
          </div>
        </div>
        <div class="bhc-right">
          <span class="status-badge status-${esc(b.status)}">${statusLabel(b.status)}</span>
          <div class="bhc-date">${formatDate(b.created_at)}</div>
        </div>
      </div>`;
  }).join('');

  const accaHtml = [...accaMap.entries()].map(([, legs]) => {
    const combinedOdds = legs.reduce((p, l) => p * parseFloat(l.odds), 1);
    const stake = parseFloat(legs[0].amount);
    const allSettled = legs.every(l => l.status !== 'pending');
    const allWon     = legs.every(l => l.status === 'won');
    const accaStatus = allSettled ? (allWon ? 'won' : 'lost') : 'pending';
    return `
      <div class="acca-card">
        <div class="acca-header">
          <div>
            <span class="acca-label">${t('acca_label')}</span>
            <span class="acca-meta">${legs.length} ${t('legs_combined').replace('{odds}', combinedOdds.toFixed(2))}</span>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <span class="status-badge status-${accaStatus}">${statusLabel(accaStatus)}</span>
            <span class="acca-payout">${fmt(stake * combinedOdds)}</span>
          </div>
        </div>
        ${legs.map(l => {
          const pick = l.bet_type === 'home' ? t('odd_home') : l.bet_type === 'away' ? t('odd_away') : t('odd_draw');
          return `
          <div class="acca-leg">
            <div class="acca-leg-info">
              <div class="acca-leg-match">${esc(l.home_team)} vs ${esc(l.away_team)}</div>
              <div class="acca-leg-meta">⚽ ${esc(leagueShortName(l.league_name))} &nbsp;·&nbsp; ${pick} @ ${parseFloat(l.odds).toFixed(2)}</div>
            </div>
            <span class="status-badge status-${l.status}">${statusLabel(l.status)}</span>
          </div>`;
        }).join('')}
        <div class="acca-footer">
          <span style="font-size:.78rem;color:var(--text-muted)">${t('stake_lbl')}: ${fmt(stake)}</span>
          <span class="bhc-date">${formatDate(legs[0].created_at)}</span>
        </div>
      </div>`;
  }).join('');

  el.innerHTML = accaHtml + singlesHtml;
}

function renderBonusSection() {
  const bs = state.bonusStatus;
  const bonusBal = parseFloat(bs?.bonus_balance ?? state.user?.bonus_balance ?? 0);
  const wagered  = parseFloat(bs?.bonus_wagered ?? 0);
  const req      = parseFloat(bs?.bonus_requirement ?? 0);
  const hasBonus = req > 0 || bonusBal > 0;
  const pct      = req > 0 ? Math.min(100, (wagered / req) * 100) : 0;
  const noBonusEver = bs && req === 0 && bonusBal === 0;

  return `
    <div class="wallet-card" style="margin-bottom:24px">
      <div class="wallet-card-title">🎁 ${t('bonus_title')}</div>
      ${hasBonus ? `
        <div style="margin-bottom:14px"><span class="bonus-balance-badge">${fmt(bonusBal)}</span> <span style="font-size:.72rem;color:var(--text-muted);margin-left:8px">${t('bonus_balance')}</span></div>
        ${req > 0 ? `
          <div class="wager-bar-label">${t('bonus_wagering')}: ${fmt(wagered)} / ${fmt(req)}</div>
          <div class="wager-bar-wrap"><div class="wager-bar" style="width:${pct}%"></div></div>
          <div class="wager-bar-label">${fmt(Math.max(0, req - wagered))} ${t('bonus_to_unlock')}</div>
        ` : ''}
      ` : `
        <div style="font-size:.85rem;color:var(--text-muted);margin-bottom:14px">${t('bonus_none')}</div>
        ${noBonusEver ? `
          <button class="btn btn-green btn-block" data-action="claim-welcome-bonus">${t('bonus_claim_welcome')}</button>
          <div style="font-size:.72rem;color:var(--text-muted);text-align:center;margin-top:8px">${t('bonus_welcome_desc')}</div>
        ` : ''}
      `}
      ${state.bonusMsg ? `<div class="wallet-result ${state.bonusMsg.type}">${esc(state.bonusMsg.text)}</div>` : ''}
    </div>`;
}

function renderAdminUsers() {

  const totalBalance   = users.reduce((s, u) => s + parseFloat(u.balance), 0);
  const totalDeposited = users.reduce((s, u) => s + parseFloat(u.total_deposited), 0);
  const totalWithdrawn = users.reduce((s, u) => s + parseFloat(u.total_withdrawn), 0);

  el.innerHTML = `
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">Total Users</div><div class="stat-value blue">${users.length}</div></div>
      <div class="stat-card"><div class="stat-label">Platform Balance</div><div class="stat-value green">${fmt(totalBalance)}</div></div>
      <div class="stat-card"><div class="stat-label">Total Deposited</div><div class="stat-value green">${fmt(totalDeposited)}</div></div>
      <div class="stat-card"><div class="stat-label">Total Withdrawn</div><div class="stat-value red">${fmt(totalWithdrawn)}</div></div>
    </div>
    <div class="data-table-wrap">
      <table class="data-table">
        <thead><tr>
          <th>User</th><th>Email</th><th>Balance</th>
          <th>Bets</th><th>Deposited</th><th>Withdrawn</th><th>Role</th><th>Joined</th><th></th>
        </tr></thead>
        <tbody>
          ${users.map(u => {
            const isAdjusting = state.adjustingUserId === u.id;
            return `
              <tr>
                <td style="font-weight:600">${esc(u.username)}</td>
                <td style="color:var(--text-muted)">${esc(u.email)}</td>
                <td style="font-weight:700;color:var(--green)">${fmt(u.balance)}</td>

                  ${u.is_admin ? '<span class="admin-badge">Admin</span>' : '<span style="color:var(--text-muted);font-size:.75rem">User</span>'}
                  ${u.id === state.user?.id
                    ? ' <span style="color:var(--text-muted);font-size:.7rem">(you)</span>'
                    : u.is_admin
                      ? `<button class="btn btn-red btn-sm" style="margin-left:6px;padding:2px 8px;font-size:.68rem" data-action="admin-toggle-admin" data-id="${u.id}">Revoke</button>`
                      : `<button class="btn btn-amber btn-sm" style="margin-left:6px;padding:2px 8px;font-size:.68rem" data-action="admin-toggle-admin" data-id="${u.id}">Promote</button>`
                  }
                </td>
                <td style="color:var(--text-muted)">${new Date(u.created_at).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}</td>
                <td>
                  ${isAdjusting
                    ? `<button class="btn btn-outline btn-sm" data-action="admin-adjust-cancel">Cancel</button>`
                    : `<button class="btn btn-amber btn-sm" data-action="admin-adjust-show" data-id="${u.id}">Adjust</button>`}
                </td>
              </tr>
              ${isAdjusting ? `
              <tr>
                <td colspan="9" class="adjust-form-cell">
                  <div class="adjust-form">
                    <input id="adjust-delta" class="adjust-input" type="number" step="0.01" placeholder="+100 or -50" autofocus>
                    <input id="adjust-note"  class="adjust-input adjust-note" type="text" placeholder="Reason (optional)" maxlength="255">
                    <button class="btn btn-sm" style="background:#a78bfa;color:#000;font-weight:700" data-action="admin-adjust-confirm" data-id="${u.id}">Apply</button>
                    ${state.adjustMsg ? `<span class="adjust-msg ${state.adjustMsg.type}">${esc(state.adjustMsg.text)}</span>` : ''}

                </td>

        </tbody>
      </table>

}

function renderAdminTxs() {
  const el = $('admin-txs-wrap'); if (!el) return;
  const txs = state.adminTxs;
  if (!txs.length) { el.innerHTML = '<div class="loading-msg">No transactions found.</div>'; return; }

  const totalDep = txs.filter(t => t.type === 'deposit')   .reduce((s, t) => s + parseFloat(t.amount), 0);
  const totalWd  = txs.filter(t => t.type === 'withdrawal').reduce((s, t) => s + parseFloat(t.amount), 0);

  el.innerHTML = `
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">Total Transactions</div><div class="stat-value blue">${txs.length}</div></div>
      <div class="stat-card"><div class="stat-label">Total Deposits</div><div class="stat-value green">+${fmt(totalDep)}</div></div>
      <div class="stat-card"><div class="stat-label">Total Withdrawals</div><div class="stat-value red">-${fmt(totalWd)}</div></div>
      <div class="stat-card"><div class="stat-label">Net Flow</div><div class="stat-value ${totalDep - totalWd >= 0 ? 'green' : 'red'}">${fmt(totalDep - totalWd)}</div></div>
    </div>
    <div class="data-table-wrap">
      <table class="data-table">
        <thead><tr>
          <th>Date</th><th>User</th><th>Type</th><th>Amount</th><th>Balance Before</th><th>Balance After</th><th>Note</th>
        </tr></thead>
        <tbody>
          ${txs.map(tx => {
            const sign = tx.type === 'deposit' ? '+' : tx.type === 'withdrawal' ? '-'
              : parseFloat(tx.balance_after) >= parseFloat(tx.balance_before) ? '+' : '-';
            const cls  = tx.type === 'adjustment'
              ? (sign === '+' ? 'style="color:#a78bfa;font-weight:700"' : 'style="color:#a78bfa;font-weight:700"')
              : `class="tx-${tx.type}" style="font-weight:700"`;
            return `
            <tr>
              <td style="color:var(--text-muted)">${formatDate(tx.created_at)}</td>
              <td style="font-weight:600">${esc(tx.username)}</td>
              <td><span class="tx-type-badge ${tx.type}">${tx.type}</span></td>
              <td ${cls}>${sign}${fmt(tx.amount)}</td>
              <td style="color:var(--text-sec)">${fmt(tx.balance_before)}</td>
              <td style="font-weight:600">${fmt(tx.balance_after)}</td>
              <td style="color:var(--text-muted);font-size:.75rem">${esc(tx.note || '')}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>`;
}

function openSlotGame() {
  if (!state.token) { $('auth-username')?.focus(); return; }
  const overlay = document.getElementById('slot-overlay');
  const frame   = document.getElementById('slot-frame');
  if (!overlay || !frame) return;
  const bal = parseFloat(state.user?.balance ?? 0);
  frame.src = `/games/olympus-strike/index.html?bal=${encodeURIComponent(bal.toFixed(2))}`;
  overlay.style.display = 'block';
  document.body.style.overflow = 'hidden';
  // Push a history entry so the browser back button can close the overlay
  history.pushState({ slotOpen: true }, '');
}

function closeSlotGame(fromPopstate = false) {
  const overlay = document.getElementById('slot-overlay');
  const frame   = document.getElementById('slot-frame');
  if (!overlay || !frame) return;
  overlay.style.display = 'none';
  frame.src = '';
  document.body.style.overflow = '';
  state.view = 'casino';
  render();
  if (state.token) loadUser().then(render);
  // If closed by the exit button (not by the back button), remove the history entry we pushed
  if (!fromPopstate) history.back();
}

// Back button: intercept while slot overlay is open
window.addEventListener('popstate', () => {
  if (document.getElementById('slot-overlay')?.style.display === 'block') {
    closeSlotGame(true); // browser already navigated back — don't call history.back() again
  }
});

window.addEventListener('message', e => {
  if (e.data === 'close-slot') closeSlotGame(false);
});

function openCasinoModal(gameId) {
  state.casinoModal = gameId;
  renderCasinoModal();
  const steps = [
    [600,  () => t('modal_verify')],
    [1300, () => t('modal_loading')],
    [2100, () => t('modal_connecting')],
    [2700, () => t('modal_ready')],
  ];
  steps.forEach(([ms, msgFn]) => {
    setTimeout(() => {
      const stat = document.querySelector('.modal-status-line em');
      if (stat) stat.textContent = msgFn();
      if (ms >= 2700) {
        const btn = document.querySelector('.modal-enter-btn');
        if (btn) { btn.disabled = false; btn.textContent = t('modal_enter'); btn.style.opacity = '1'; btn.style.cursor = 'pointer'; }
      }
    }, ms);
  });
}

// ─── Events ──────────────────────────────────────────────────────────────────
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  const action = el?.dataset?.action;
  if (!action) return;

  switch (action) {
    case 'set-lang': setLang(el.dataset.lang); break;
    case 'login':    login();    break;
    case 'register': register(); break;
    case 'logout':   logout();   break;
    case 'tab-login':          state.authTab = 'login'; state.authError = null; state.showForgot = false; renderSidebar(); break;
    case 'tab-register':       state.authTab = 'register'; state.authError = null; state.showForgot = false; renderSidebar(); break;
    case 'open-register-modal': openRegisterModal(); break;
    case 'show-forgot':        state.showForgot = true; renderSidebar(); break;
    case 'hide-forgot':        state.showForgot = false; renderSidebar(); break;
    case 'submit-forgot':      submitForgotPassword(); break;
    case 'submit-reset':       submitResetPassword(el.dataset.token); break;
    case 'rc-continue':        $('modal-root').innerHTML = ''; break;
    case 'rc-close-today':     $('modal-root').innerHTML = ''; selfExclude(1); break;
    case 'search-clear':
      state.searchQuery = '';
      if (state.view === 'matches') renderMatchList();
      renderHeader();
      $('match-search')?.focus();
      break;
    case 'view-matches': state.view = 'matches'; state.walletMsg = null; render(); break;
    case 'view-scores':  state.view = 'scores';  state.walletMsg = null; render(); break;
    case 'view-casino':  state.view = 'casino';  state.walletMsg = null; render(); break;
    case 'casino-cat':   state.casinoCategory = el.dataset.cat; renderCasinoView(); break;
    case 'play-game':
      if (el.dataset.id === 'olympus-strike') openSlotGame();
      else openCasinoModal(el.dataset.id);
      break;
    case 'filter-league':
      state.activeLeague = el.dataset.key || null;
      renderLeagueNav(); renderMatchList(); break;
    case 'view-my-bets':
      if (!state.token) { $('auth-username')?.focus(); return; }
      state.view = 'my-bets'; render(); loadMyBets(); break;
    case 'view-wallet':
      if (!state.token) return;
      state.view = 'wallet'; state.walletMsg = null; state.bonusMsg = null; state.rgMsg = null;
      render();
      Promise.all([loadTransactions(), loadBonusStatus(), loadRG()]).then(() => renderWalletView());
      break;
    case 'claim-welcome-bonus': claimWelcomeBonus(false); break;
    case 'rg-save': saveRG(); break;
    case 'rg-exclude': selfExclude(parseInt(el.dataset.days)); break;
    case 'resend-verification': resendVerification(); break;
    case 'wallet-quick-dep':
      if ($('deposit-amount'))  $('deposit-amount').value  = el.dataset.val; break;
    case 'wallet-quick-wd':
      if ($('withdraw-amount')) $('withdraw-amount').value = el.dataset.val; break;
    case 'do-deposit':  deposit();  break;
    case 'do-withdraw': withdraw(); break;
    case 'admin-tab':
      state.adminTab = el.dataset.tab; state.adminMsg = null;
      state.adjustingUserId = null; state.adjustMsg = null;
      renderAdminView();
      break;
    case 'admin-live-show': {
      state.liveControlMatchId = parseInt(el.dataset.id);
      state.editingMatchId = null; state.settlingMatchId = null; state.oddsEditingMatchId = null;
      renderAdminMatchList(); break;
    }
    case 'admin-live-cancel':
      state.liveControlMatchId = null; renderAdminMatchList(); break;
    case 'lc-kickoff': adminUpdateStatus(parseInt(el.dataset.id), { status:'live', match_minute:1, home_score:0, away_score:0 }); break;
    case 'lc-halftime': adminUpdateStatus(parseInt(el.dataset.id), { status:'halftime' }); break;
    case 'lc-2ndhalf': adminUpdateStatus(parseInt(el.dataset.id), { status:'live', match_minute:46 }); break;
    case 'lc-fulltime': adminUpdateStatus(parseInt(el.dataset.id), { status:'finished' }); break;
    case 'lc-score-inc-home': { const m = state.adminMatches.find(x=>x.id===parseInt(el.dataset.id)); if(m) adminUpdateStatus(m.id,{home_score:(m.home_score??0)+1}); break; }
    case 'lc-score-dec-home': { const m = state.adminMatches.find(x=>x.id===parseInt(el.dataset.id)); if(m) adminUpdateStatus(m.id,{home_score:Math.max(0,(m.home_score??0)-1)}); break; }
    case 'lc-score-inc-away': { const m = state.adminMatches.find(x=>x.id===parseInt(el.dataset.id)); if(m) adminUpdateStatus(m.id,{away_score:(m.away_score??0)+1}); break; }
    case 'lc-score-dec-away': { const m = state.adminMatches.find(x=>x.id===parseInt(el.dataset.id)); if(m) adminUpdateStatus(m.id,{away_score:Math.max(0,(m.away_score??0)-1)}); break; }
    case 'lc-set-minute': { const v=parseInt($('lc-minute')?.value); if(!isNaN(v)&&v>0) adminUpdateStatus(parseInt(el.dataset.id),{match_minute:v}); break; }
    case 'admin-odds-show':
      state.oddsEditingMatchId = parseInt(el.dataset.id);
      state.editingMatchId = null; state.settlingMatchId = null;
      renderAdminMatchList(); break;
    case 'admin-odds-cancel':
      state.oddsEditingMatchId = null; renderAdminMatchList(); break;
    case 'admin-odds-save':
      adminUpdateOdds(parseInt(el.dataset.id)); break;
    case 'admin-toggle-admin': adminToggleAdmin(parseInt(el.dataset.id)); break;
    case 'admin-adjust-show':
      state.adjustingUserId = parseInt(el.dataset.id); state.adjustMsg = null;
      renderAdminUsers(); break;
    case 'admin-adjust-cancel':
      state.adjustingUserId = null; state.adjustMsg = null;
      renderAdminUsers(); break;
    case 'admin-adjust-confirm':
      adminAdjustBalance(parseInt(el.dataset.id)); break;
    case 'view-admin':
      if (!state.user?.is_admin) return;
      state.view = 'admin'; state.adminTab = 'matches'; state.adminMsg = null;
      render(); loadAdminMatches(); break;
    case 'bet':        toggleBet(el.dataset.match, el.dataset.type, el.dataset.odds); break;
    case 'remove-bet': removeBet(el.dataset.match); break;
    case 'place-bets': placeAllBets(); break;
    case 'place-acca': placeAccumulator(); break;
    case 'slip-mode':
      state.betSlipMode = el.dataset.mode; state.msg = null; renderSidebar(); break;
    case 'quick-stake': state.stake = el.dataset.val; render(); break;
    case 'fab-scroll-slip':
      document.getElementById('sidebar')?.scrollIntoView({ behavior: 'smooth', block: 'start' }); break;
    // Admin
    case 'admin-add-show':   state.showAddMatch = true;  state.adminMsg = null; renderAdminView(); break;
    case 'admin-add-cancel': state.showAddMatch = false; renderAdminView(); break;
    case 'admin-create':     adminCreateMatch(); break;
    case 'admin-edit':       state.editingMatchId = parseInt(el.dataset.id); state.settlingMatchId = null; state.oddsEditingMatchId = null; state.liveControlMatchId = null; renderAdminMatchList(); break;
    case 'admin-edit-cancel': state.editingMatchId = null; renderAdminMatchList(); break;
    case 'admin-save':       adminSaveMatch(parseInt(el.dataset.id)); break;
    case 'admin-delete':     adminDeleteMatch(parseInt(el.dataset.id)); break;
    case 'admin-settle-show':
      state.settlingMatchId = parseInt(el.dataset.id); state.editingMatchId = null; state.oddsEditingMatchId = null; state.liveControlMatchId = null;
      state.settleResult = null; renderAdminMatchList(); break;
    case 'admin-settle-cancel': state.settlingMatchId = null; state.settleResult = null; renderAdminMatchList(); break;
    case 'settle-pick':       state.settleResult = el.dataset.result; renderAdminMatchList(); break;
    case 'admin-settle-confirm': adminSettleMatch(parseInt(el.dataset.id)); break;
  }
});

document.addEventListener('input', e => {
  if (e.target.id === 'match-search') {
    state.searchQuery = e.target.value;
    if (state.view === 'matches') renderMatchList();
    // re-render header to show/hide the clear button
    renderHeader();
    // restore focus after header re-render
    const inp = $('match-search');
    if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
    return;
  }
  if (e.target.id !== 'stake-input') return;
  state.stake = e.target.value;
  const stake = parseFloat(e.target.value) || 0;
  const rows = document.querySelectorAll('.sum-value');
  if (rows[0]) rows[0].textContent = fmt(stake * state.betSlip.length);
  if (rows[1]) rows[1].textContent = fmt(state.betSlip.reduce((s, b) => s + stake * b.odds, 0));
});

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.classList.contains('form-input'))
    state.authTab === 'login' ? login() : register();
});

function closeRegisterModal() {
  $('reg-modal-root')?.remove();
  document.body.style.overflow = '';
}

function _regToggleBonus() {
  const open = $('ri-bonus-wrap')?.classList.toggle('open');
  $('ri-bonus-toggle')?.classList.toggle('open', open);
  if (open) $('ri-bonus-code')?.focus();
}

function _regNext() {
  const email = $('ri-email')?.value.trim() ?? '';
  const pass  = $('ri-pass')?.value ?? '';
  const tos   = $('ri-chk-tos')?.checked;
  let ok = true;

  const setErr = (fieldId, hasErr) => {
    $('reg-modal-root')?.querySelector(`#${fieldId}`)?.classList.toggle('has-error', hasErr);
  };

  const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  setErr('rf-email', !emailOk); if (!emailOk) ok = false;

  const passOk = pass.length >= 6;
  setErr('rf-pass', !passOk); if (!passOk) ok = false;

  const tosErr = $('ri-tos-err');
  if (!tos) { tosErr?.classList.add('show'); ok = false; }
  else      { tosErr?.classList.remove('show'); }

  if (!ok) return;

  _regData.email      = email;
  _regData.password   = pass;
  _regData.bonusCode  = $('ri-bonus-code')?.value.trim() || '';
  _regData.wantsEmail = $('ri-chk-email')?.checked || false;

  const suggested = email.split('@')[0].replace(/[^a-zA-Z0-9_.-]/g, '').slice(0, 20);
  if ($('ri-user')) $('ri-user').value = suggested;

  $('reg-s1').style.display = 'none';
  $('reg-s2').style.display = 'block';
  setTimeout(() => $('ri-user')?.focus(), 40);
}

function _regBack() {
  $('reg-s2').style.display = 'none';
  $('reg-s1').style.display = 'block';
  const errEl = $('ri-err-2');
  if (errEl) { errEl.classList.remove('show'); errEl.textContent = ''; }
  setTimeout(() => $('ri-email')?.focus(), 40);
}

async function _regSubmit() {
  const username = $('ri-user')?.value.trim() ?? '';
  const userField = $('reg-modal-root')?.querySelector('#rf-user');
  const errEl     = $('ri-err-2');
  const btn       = $('ri-submit-btn');

  const userOk = username.length >= 3;
  userField?.classList.toggle('has-error', !userOk);
  if (!userOk) return;

  if (btn) { btn.disabled = true; btn.textContent = 'Δημιουργία λογαριασμού…'; }
  if (errEl) { errEl.classList.remove('show'); errEl.textContent = ''; }

  try {
    const data = await api('/api/register', {
      method: 'POST',
      body: JSON.stringify({ username, email: _regData.email, password: _regData.password }),
    });
    applyAuthSuccess(data);
    claimWelcomeBonus(true).then(() => { renderHeader(); });
    closeRegisterModal();
  } catch (err) {
    if (errEl) { errEl.textContent = err.message; errEl.classList.add('show'); }
    if (btn) { btn.disabled = false; btn.textContent = 'ΔΗΜΙΟΥΡΓΙΑ ΛΟΓΑΡΙΑΣΜΟΥ'; }
  }
}

// Close reg modal on Escape
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('reg-modal-root')) closeRegisterModal();
  if (e.key === 'Enter') {
    if (e.target.id === 'ri-email' || e.target.id === 'ri-pass' || e.target.id === 'ri-bonus-code') _regNext();
    if (e.target.id === 'ri-user') _regSubmit();
  }
});

// ─── Init ────────────────────────────────────────────────────────────────────
(async function init() {
  renderHeader(); renderPage();
  await Promise.all([loadUser(), loadMatches()]);
  render();
  if (state.user) startRealityCheck();
  await handleUrlTokens();
  connectOddsStream();
  // Jackpot ticker updater — only burns CPU when casino is open
  setInterval(() => { if (state.view === 'casino') updateJackpots(); }, 3200);
})();
</script>
